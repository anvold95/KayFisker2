<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisker / Genealogisk Apparat v.10.4</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fisker: {
                            red: '#9B2C2C',
                            ink: '#1a1a1a',
                            paper: '#f5f5f0',
                            glass: 'rgba(255, 255, 255, 0.65)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Libre Baskerville', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background: radial-gradient(circle at center, #fdfdfd 0%, #ebebeb 100%);
            color: #1a1a1a; 
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.03);
        }
        
        .glass-membrane {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.08; transform: scale(1); }
            50% { opacity: 0.15; transform: scale(1.05); }
        }
        .animate-glow { animation: glow-pulse 12s ease-in-out infinite; }
        
        @keyframes breathe {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }
        .animate-breathe { animation: breathe 6s ease-in-out infinite; }

        .source-node { 
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
            cursor: move; 
        }
        .source-node:hover { 
            scale: 1.02; 
            z-index: 100; 
            background: rgba(255, 255, 255, 0.98) !important; 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08); 
            width: 320px !important; 
        }
        .source-node.active { 
            border: 1px solid #9B2C2C; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
            z-index: 50; 
            width: 350px !important; 
            background: rgba(255, 255, 255, 0.98); 
        }
        .source-node.dragging { 
            opacity: 0.8; 
            cursor: grabbing; 
            z-index: 200; 
        }
        
        .visual-node { 
            border-radius: 2px; 
            overflow: hidden; 
            border: 4px solid white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            opacity: 0; 
            animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            animation-delay: 1.2s; 
        }
        @keyframes pop-in { 
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 
        }
        
        .visual-line { 
            stroke-dasharray: 1000; 
            stroke-dashoffset: 1000; 
            animation: draw-line 1.5s ease-out forwards; 
        }
        @keyframes draw-line { 
            to { stroke-dashoffset: 0; } 
        }
    </style>
</head>
<body class="bg-fisker-paper selection:bg-fisker-red selection:text-white overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const LucideIcon = ({ name, className = "", size = 16 }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide?.icons?.[name]) {
                    containerRef.current.innerHTML = '';
                    containerRef.current.innerHTML = window.lucide.icons[name].toSvg({
                        width: size, height: size, class: className
                    });
                }
            }, [name, className, size]);
            return <span ref={containerRef} className="inline-flex items-center justify-center" />;
        };

        const App = () => {
            const [documentText, setDocumentText] = useState("");
            const [lastQuery, setLastQuery] = useState(""); 
            const [activeStrata, setActiveStrata] = useState([]);
            const [visualNodes, setVisualNodes] = useState([]); 
            const [detectedVisuals, setDetectedVisuals] = useState([]);
            const [genealogy, setGenealogy] = useState(null);
            const [syntheticResponse, setSyntheticResponse] = useState("");
            const [isSynthesizing, setIsSynthesizing] = useState(false);
            const [selectedSources, setSelectedSources] = useState([]);
            const [hoveredSource, setHoveredSource] = useState(null);
            const [logs, setLogs] = useState([]);
            const [expandedVisual, setExpandedVisual] = useState(null);
            const [discursiveState, setDiscursiveState] = useState("SEDIMENTERING");
            const [intensity, setIntensity] = useState(0.0);
            
            const [draggedNode, setDraggedNode] = useState(null);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            
            const [selectedConcept, setSelectedConcept] = useState(null);
            const [showGenealogy, setShowGenealogy] = useState(false);
            
            const [viewport, setViewport] = useState({ 
                w: typeof window !== 'undefined' ? window.innerWidth : 1200, 
                h: typeof window !== 'undefined' ? window.innerHeight : 800 
            });

            const rams = {
                red: "#9B2C2C",
                blue: "#1a1a1a",
                orange: "#a16207",
                purple: "#7e22ce",
                green: "#15803d"
            };

            const addLog = (msg) => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg }].slice(-3));
            };

            useEffect(() => {
                const onResize = () => setViewport({ w: window.innerWidth, h: window.innerHeight });
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            const getSmartPosition = (year, existingNodes = []) => {
                const allNodes = [...activeStrata, ...visualNodes, ...existingNodes];
                const yearNum = parseInt(year) || 1950;
                const age = 2024 - yearNum;
                const baseDepth = 15 + Math.min((age / 100) * 60, 60);
                
                const forbiddenZone = { xMin: 20, xMax: 80, yMin: 70, yMax: 100 };
                const nodeHeight = 20;
                const minDistance = 30;
                
                const isValidPosition = (x, y) => {
                    if (x >= forbiddenZone.xMin && x <= forbiddenZone.xMax &&
                        y >= forbiddenZone.yMin && y <= forbiddenZone.yMax) return false;
                    if (x < 5 || x > 95 || y < 5 || y > 85) return false;
                    
                    for (const node of allNodes) {
                        const dx = Math.abs(node.pos.x - x);
                        const dy = Math.abs(node.pos.y - y);
                        if (dx < minDistance && dy < (nodeHeight + 2)) return false;
                    }
                    return true;
                };
                
                for (let radius = 0; radius <= 40; radius += 10) {
                    for (let i = 0; i < 16; i++) {
                        const angle = (i / 16) * 2 * Math.PI;
                        const x = 50 + radius * Math.cos(angle);
                        const y = baseDepth + radius * 0.5 * Math.sin(angle);
                        if (isValidPosition(x, y)) return { x, y };
                    }
                }
                
                return { x: allNodes.length % 2 === 0 ? 8 : 92, y: baseDepth };
            };

            const handleMouseDown = (e, nodeId) => {
                if (e.button !== 0) return;
                e.preventDefault();
                const node = activeStrata.find(s => s.id === nodeId);
                if (!node) return;
                
                const rect = e.currentTarget.getBoundingClientRect();
                setDragOffset({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                });
                setDraggedNode(nodeId);
            };

            const handleMouseMove = (e) => {
                if (!draggedNode) return;
                const newX = ((e.clientX - dragOffset.x) / viewport.w) * 100;
                const newY = ((e.clientY - dragOffset.y) / viewport.h) * 100;
                const clampedX = Math.max(5, Math.min(95, newX));
                const clampedY = Math.max(5, Math.min(85, newY));
                
                setActiveStrata(prev => prev.map(s => 
                    s.id === draggedNode ? { ...s, pos: { x: clampedX, y: clampedY } } : s
                ));
            };

            const handleMouseUp = () => {
                setDraggedNode(null);
            };

            useEffect(() => {
                if (draggedNode) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                    return () => {
                        window.removeEventListener('mousemove', handleMouseMove);
                        window.removeEventListener('mouseup', handleMouseUp);
                    };
                }
            }, [draggedNode, dragOffset]);

            const executeGenealogicalRAG = async (text) => {
                if (isSynthesizing) return;
                const prompt = text || documentText;
                if (!prompt || prompt.trim().length < 3) {
                    addLog("Spørsmål for kort");
                    return;
                }
                
                setLastQuery(prompt);
                setIsSynthesizing(true);
                addLog(`Aktiverer genealogisk analyse...`);

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: prompt })
                    });
                    
                    if (!response.ok) {
                        const err = await response.json();
                        addLog(err.error || "Fejl");
                        setSyntheticResponse(err.text || "");
                        return;
                    }
                    
                    const data = await response.json();
                    
                    const newStrata = [];
                    if (data.strata && Array.isArray(data.strata)) {
                        data.strata.forEach((s, i) => {
                            newStrata.push({
                                ...s,
                                pos: getSmartPosition(s.year, newStrata),
                                color: s.type === "PRIMARY" ? rams.blue : 
                                       s.type === "QUOTES" ? rams.orange : rams.red
                            });
                        });
                        setActiveStrata(newStrata);
                    }

                    setDetectedVisuals(data.visuals || []);
                    setVisualNodes([]);
                    setSyntheticResponse(data.text || "");
                    setDiscursiveState(data.state || "GENEALOGI");
                    setIntensity(data.intensity || 0.8);
                    setGenealogy(data.genealogy || null);
                    setSelectedSources([]);
                    addLog(`Genealogi etableret.`);
                } catch (error) {
                    addLog(`Fejl: ${error.message}`);
                } finally {
                    setIsSynthesizing(false);
                }
            };

            const handleTryAgain = () => {
                if (!lastQuery) return;
                executeGenealogicalRAG(lastQuery);
            };

            const spawnVisual = (visual) => {
                if (visualNodes.find(v => v.keyword === visual.keyword)) return;
                const pos = getSmartPosition(1960, visualNodes);
                const newNode = { ...visual, id: `vis-${Date.now()}`, pos: pos };
                setVisualNodes(prev => [...prev, newNode]);
                addLog(`Projiserer: ${visual.keyword}`);
            };

            const renderResponseWithVisuals = (text) => {
                if (!detectedVisuals || !detectedVisuals.length) return text;
                const patterns = detectedVisuals.map(v => v.keyword).join("|");
                const regex = new RegExp(`(${patterns})`, "gi");
                const parts = text.split(regex);

                return parts.map((part, i) => {
                    const match = detectedVisuals.find(v => v.keyword.toLowerCase() === part.toLowerCase());
                    if (match) {
                        const isActive = visualNodes.find(n => n.keyword === match.keyword);
                        return (
                            <span 
                                key={i}
                                onClick={() => spawnVisual(match)}
                                className={`cursor-pointer transition-all border-b font-medium mx-0.5 px-1 rounded-sm ${
                                    isActive 
                                        ? 'border-fisker-red text-fisker-red bg-red-50' 
                                        : 'border-dashed border-gray-400 text-gray-600 hover:border-fisker-ink hover:bg-gray-50'
                                }`}
                                title="Klik for å projisere bilde">
                                <LucideIcon name="image" size={14} className="inline mr-1 mb-0.5 opacity-50" />
                                {part}
                            </span>
                        );
                    }
                    return part;
                });
            };

            const toggleSource = (source) => {
                if (draggedNode) return;
                setSelectedSources(prev => {
                    const exists = prev.find(s => s.id === source.id);
                    if (exists) return prev.filter(s => s.id !== source.id);
                    return [...prev, source];
                });
            };

            const closeSidebar = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                setSelectedSources([]);
                setHoveredSource(null);
            };

            const getHighlightedText = (fullText, response, sourceRef) => {
                if (!response || !fullText) return <span className="opacity-70 text-[15px]">{fullText}</span>;
                
                let attributedSegments = [];
                if (genealogy && genealogy.source_attributions) {
                    const attr = genealogy.source_attributions.find(a => a.source_ref === sourceRef);
                    if (attr && attr.segments) {
                        attributedSegments = attr.segments.map(s => s.text);
                    }
                }

                const sentences = fullText.split(/([.!?]+)/).filter(Boolean);
                const responseWords = response.toLowerCase().split(' ');
                let reconstructed = [];
                for (let i = 0; i < sentences.length; i += 2) {
                    reconstructed.push((sentences[i] + (sentences[i+1] || "")).trim());
                }

                return reconstructed.map((s, i) => {
                    const isBackendAttributed = attributedSegments.some(seg => 
                        s.includes(seg) || seg.includes(s)
                    );
                    const matchCount = s.toLowerCase().split(' ').filter(w => 
                        responseWords.includes(w) && w.length > 4
                    ).length;
                    const isSoftActivated = matchCount > 1;

                    let className = "opacity-70 text-[15px]";
                    if (isBackendAttributed) {
                        className = "bg-red-100 text-black font-bold border-b-2 border-red-400 text-[15px]";
                    } else if (isSoftActivated) {
                        className = "bg-red-50 text-black border-b border-red-200 text-[15px]";
                    }

                    return <span key={i} className={`transition-all duration-500 mr-1 ${className}`}>{s} </span>;
                });
            };

            const handleSubmit = () => executeGenealogicalRAG(documentText);
            const handleKeyPress = (e) => { 
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleSubmit();
            };

            const resetAll = () => {
                setDocumentText("");
                setLastQuery("");
                setSyntheticResponse("");
                setActiveStrata([]);
                setVisualNodes([]);
                setDetectedVisuals([]);
                setGenealogy(null);
                setSelectedSources([]);
                setSelectedConcept(null);
                setHoveredSource(null);
            };

            const renderDiscursiveShifts = () => {
                if (!genealogy?.discursive_shifts?.shifts) return null;
                return genealogy.discursive_shifts.shifts.map((shift, i) => {
                    const sourceA = activeStrata.find(s => s.ref === shift.source_a);
                    const sourceB = activeStrata.find(s => s.ref === shift.source_b);
                    if (!sourceA || !sourceB) return null;
                    
                    const strokeColor = shift.type === "MAJOR_SHIFT" ? "#7f1d1d" : "#9a3412";
                    const strokeWidth = shift.type === "MAJOR_SHIFT" ? 1.5 : 1;
                    
                    return (
                        <g key={`shift-${i}`}>
                            <line 
                                x1={`${sourceA.pos.x}%`} y1={`${sourceA.pos.y}%`}
                                x2={`${sourceB.pos.x}%`} y2={`${sourceB.pos.y}%`}
                                stroke={strokeColor} strokeWidth={strokeWidth}
                                strokeDasharray="5,3" opacity="0.3"
                            />
                        </g>
                    );
                });
            };

            const renderConceptConnections = () => {
                if (!selectedConcept || !genealogy?.concept_genealogies?.[selectedConcept]) return null;
                const conceptData = genealogy.concept_genealogies[selectedConcept];
                const sourceIds = conceptData.occurrences.map(o => o.source_id);
                const connectedNodes = activeStrata.filter(s => sourceIds.includes(s.id));
                
                return connectedNodes.map((node, i) => {
                    if (i === 0) return null;
                    const prev = connectedNodes[i - 1];
                    return (
                        <line key={`concept-${i}`}
                            x1={`${prev.pos.x}%`} y1={`${prev.pos.y}%`}
                            x2={`${node.pos.x}%`} y2={`${node.pos.y}%`}
                            stroke="#7e22ce" strokeWidth="1.5"
                            strokeDasharray="3,2" opacity="0.4"
                        />
                    );
                });
            };

            return (
                <div className="h-screen w-screen flex flex-col relative bg-fisker-paper font-sans overflow-hidden">
                    {/* TOPBAR */}
                    <header className="h-12 border-b border-white/40 flex items-center justify-between px-6 z-50 fixed top-0 w-full bg-white/20 backdrop-blur-md">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-2">
                                <div className="w-5 h-5 bg-fisker-red flex items-center justify-center text-white font-serif font-bold text-[10px]">F</div>
                                <h1 className="text-[11px] font-mono font-bold uppercase tracking-[0.2em] text-stone-700">Genealogisk Apparat v.10.4</h1>
                            </div>
                            <span className={`text-[9px] mono font-bold tracking-widest uppercase ${isSynthesizing ? 'text-fisker-red animate-pulse' : 'text-stone-400'}`}>{discursiveState}</span>
                            
                            {genealogy?.epistemic_levels && (
                                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-stone-100/80 border border-stone-200">
                                    <span className={`text-[9px] mono font-medium tracking-wide ${
                                        genealogy.epistemic_levels.primary_level === 'ARKIVFAKTA' ? 'text-emerald-700' :
                                        genealogy.epistemic_levels.primary_level === 'ARKIV-NÆR TOLKNING' ? 'text-sky-700' :
                                        'text-amber-700'
                                    }`}>
                                        {genealogy.epistemic_levels.primary_level}
                                    </span>
                                </div>
                            )}
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <button 
                                onClick={() => setShowGenealogy(!showGenealogy)}
                                className={`px-3 py-1.5 rounded-full text-[9px] mono font-medium tracking-wide transition-all ${
                                    showGenealogy ? 'bg-stone-700 text-white' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                                }`}>
                                Genealogi
                            </button>
                            
                            {genealogy?.discursive_shifts && (
                                <span className="text-[9px] mono text-stone-500">
                                    {genealogy.discursive_shifts.shifts.length} brudd
                                </span>
                            )}
                        </div>
                    </header>

                    <main className={`flex-grow relative z-10 transition-all duration-500 ${selectedSources.length > 0 || showGenealogy ? 'mr-[520px]' : 'mr-0'}`} style={{ marginTop: '48px' }}>
                        
                        {isSynthesizing && (
                            <div className="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
                                <div className="w-[50vh] h-[50vh] rounded-full blur-[100px] bg-gradient-to-tr from-stone-200 to-gray-200 opacity-30 animate-breathe"></div>
                            </div>
                        )}

                        <div className="absolute inset-0 z-0 pointer-events-none">
                            {activeStrata.map((s, i) => ( 
                                <div key={`glow-${i}`} className="absolute rounded-full animate-glow blur-[80px]" 
                                    style={{ 
                                        left: `${s.pos.x}%`, top: `${s.pos.y}%`, 
                                        width: '40%', height: '40%', 
                                        background: `radial-gradient(circle, ${s.color} 0%, transparent 80%)`, 
                                        transform: 'translate(-50%, -50%)', 
                                        animationDelay: `${i * 2}s`, 
                                        opacity: 0.12 
                                    }} 
                                /> 
                            ))}
                        </div>

                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                            {visualNodes.map((v, i) => ( 
                                <path key={`vis-link-${i}`} 
                                    d={`M ${viewport.w / 2} ${viewport.h - 140} Q ${v.pos.x * viewport.w / 100} ${viewport.h - 50} ${v.pos.x * viewport.w / 100} ${v.pos.y * viewport.h / 100}`}
                                    stroke="#3b82f6" strokeWidth="1.5" fill="none" 
                                    className="visual-line opacity-30" 
                                /> 
                            ))}
                            
                            {showGenealogy && renderDiscursiveShifts()}
                            {showGenealogy && renderConceptConnections()}
                            
                            {selectedSources.length > 1 && selectedSources.map((s, i) => {
                                const next = selectedSources[i + 1];
                                if (!next) return null;
                                return <line key={`link-${i}`} x1={`${s.pos.x}%`} y1={`${s.pos.y}%`} x2={`${next.pos.x}%`} y2={`${next.pos.y}%`} stroke="#0ea5e9" strokeWidth="2" opacity="0.3" />;
                            })}

                            {activeStrata.map((s, i) => (hoveredSource === s.id || selectedSources.find(ss => ss.id === s.id)) && ( 
                                <path key={`path-${i}`} 
                                    d={`M ${viewport.w / 2} ${viewport.h - 140} C ${viewport.w / 2} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${s.pos.y * viewport.h / 100}`} 
                                    stroke={s.color} strokeWidth="1" fill="none" 
                                    strokeDasharray="4,2" className="animate-in fade-in duration-700 opacity-30" 
                                /> 
                            ))}
                        </svg>

                        <div className="absolute inset-0 z-20 pointer-events-none">
                            {activeStrata.map((s, i) => {
                                const isSelected = selectedSources.find(ss => ss.id === s.id);
                                const isDragging = draggedNode === s.id;
                                const isDimmed = selectedSources.length > 0 && !isSelected;
                                const hasAttribution = genealogy?.source_attributions?.find(a => a.source_ref === s.ref);
                                
                                const displayText = s.excerpt || s.text;
                                const textLength = isSelected ? 900 : (hoveredSource === s.id ? 250 : 110);

                                return (
                                    <div key={s.id} 
                                        onMouseDown={(e) => handleMouseDown(e, s.id)}
                                        onClick={() => toggleSource(s)}
                                        onMouseEnter={() => setHoveredSource(s.id)}
                                        onMouseLeave={() => setHoveredSource(null)}
                                        className={`source-node absolute p-6 w-[280px] pointer-events-auto bg-white/50 backdrop-blur-xl border-l-2 border border-white/40 ${
                                            isDragging ? 'dragging' : ''
                                        } ${isDimmed ? 'opacity-30 blur-[1px]' : 'opacity-100'} ${isSelected ? 'active' : 'shadow-sm'}`} 
                                        style={{ 
                                            left: `${s.pos.x}%`, top: `${s.pos.y}%`, 
                                            transform: 'translate(-50%, -50%)', 
                                            borderColor: (hoveredSource === s.id || isSelected) ? s.color : 'rgba(255,255,255,0.5)',
                                            borderLeftColor: s.color,
                                            cursor: isDragging ? 'grabbing' : 'move'
                                        }}>
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-[10px] mono font-medium uppercase tracking-wider text-stone-600">
                                                {s.type}
                                            </span>
                                            <div className="flex items-center gap-2">
                                                {hasAttribution && <div className="w-2 h-2 rounded-full bg-fisker-red" title="Brukt i svar"></div>}
                                                {isSelected && <LucideIcon name="check-circle" size={14} className="text-emerald-600" />}
                                                <span className="text-[10px] mono text-gray-400">#{s.year || '?'}</span>
                                            </div>
                                        </div>
                                        <p className={`serif italic transition-all duration-500 leading-relaxed ${
                                            hoveredSource === s.id || isSelected ? 'text-[14px] text-stone-900' : 'text-[12px] text-stone-600'
                                        }`}>
                                            "{displayText.substring(0, textLength)}{displayText.length > textLength ? '...' : ''}"
                                        </p>
                                        {s.excerpt_relevance && s.excerpt_relevance > 0.5 && !isSelected && (
                                            <div className="mt-3 text-[9px] mono text-sky-600 opacity-60" title={s.excerpt_explanation}>
                                                ↗ {Math.round(s.excerpt_relevance * 100)}%
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        <div className="absolute inset-0 z-30 pointer-events-none">
                            {visualNodes.map((v) => (
                                <div key={v.id} 
                                    onClick={() => setExpandedVisual(v)} 
                                    className="visual-node absolute w-40 h-32 pointer-events-auto cursor-zoom-in hover:scale-110 transition-all duration-500 bg-white" 
                                    style={{ left: `${v.pos.x}%`, top: `${v.pos.y}%` }}>
                                    <img src={v.url} className="w-full h-full object-cover" alt={v.keyword} />
                                    <div className="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-[10px] p-1.5 mono backdrop-blur-sm">{v.keyword}</div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {expandedVisual && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-white/80 backdrop-blur-md animate-in fade-in duration-300" 
                            onClick={() => setExpandedVisual(null)}>
                            <div className="relative max-w-4xl max-h-[80vh] bg-white p-2 shadow-2xl rounded-sm border border-gray-200">
                                <img src={expandedVisual.url} className="max-h-[75vh] w-auto object-contain" alt={expandedVisual.keyword} />
                                <div className="absolute -bottom-10 left-0 text-black">
                                    <h3 className="text-xl serif italic">{expandedVisual.keyword}</h3>
                                    <p className="text-[10px] mono text-gray-500">Arkivmateriale // {expandedVisual.type}</p>
                                </div>
                                <button className="absolute -top-12 right-0 text-black hover:text-red-500 text-[10px] uppercase font-bold tracking-widest flex items-center gap-2">
                                    LUK <LucideIcon name="x" size={16} />
                                </button>
                            </div>
                        </div>
                    )}

                    {(selectedSources.length > 0 || showGenealogy) && (
                        <aside className="fixed right-0 top-12 bottom-0 w-[520px] glass-panel z-40 overflow-y-auto flex flex-col shadow-xl">
                            <header className="p-6 border-b border-white/20 sticky top-0 z-10 backdrop-blur-md bg-white/40">
                                <div className="flex justify-between items-center mb-3">
                                    <div>
                                        <h2 className="text-[13px] font-bold text-stone-800 mb-1">
                                            {showGenealogy ? "Genealogisk Analyse" : "Arbejdsbord"}
                                        </h2>
                                        {selectedSources.length > 0 && (
                                            <p className="text-[10px] mono text-stone-500">
                                                {selectedSources.length} kilder valgt
                                            </p>
                                        )}
                                    </div>
                                    <button onClick={() => { closeSidebar(); setShowGenealogy(false); }} 
                                        className="w-8 h-8 rounded-full hover:bg-stone-200/50 flex items-center justify-center">
                                        <LucideIcon name="x" size={16} />
                                    </button>
                                </div>
                                
                                {genealogy?.concept_genealogies && Object.keys(genealogy.concept_genealogies).length > 0 && (
                                    <div className="mt-4">
                                        <label className="text-[10px] mono font-medium text-stone-500 mb-2 block">Spor begrep</label>
                                        <select 
                                            value={selectedConcept || ""}
                                            onChange={(e) => setSelectedConcept(e.target.value || null)}
                                            className="w-full text-[11px] mono p-2 border border-stone-200 rounded bg-white/50">
                                            <option value="">-- Velg begrep --</option>
                                            {Object.keys(genealogy.concept_genealogies).map(concept => (
                                                <option key={concept} value={concept}>
                                                    {concept} ({genealogy.concept_genealogies[concept].total_occurrences})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                )}
                            </header>
                            
                            <div className="flex-grow overflow-y-auto p-6 space-y-6">
                                {selectedSources.length > 0 && selectedSources.map((s, i) => {
                                    const attr = genealogy?.source_attributions?.find(a => a.source_ref === s.ref);
                                    return (
                                        <div key={s.id} className="bg-white/60 p-5 rounded-sm space-y-4 border border-white">
                                            <div className="flex items-start justify-between">
                                                <div>
                                                    <div className="text-[10px] mono font-medium text-stone-600 mb-1">{s.type}</div>
                                                    <div className="text-[11px] mono text-stone-500">{s.ref}</div>
                                                </div>
                                                {attr && (
                                                    <span className={`text-[9px] mono px-2 py-1 rounded ${
                                                        attr.confidence === 'high' ? 'bg-emerald-100 text-emerald-700' :
                                                        attr.confidence === 'medium' ? 'bg-sky-100 text-sky-700' :
                                                        'bg-amber-100 text-amber-700'
                                                    }`}>
                                                        {attr.epistemic_level}
                                                    </span>
                                                )}
                                            </div>
                                            <div className="serif text-[14px] leading-relaxed text-stone-800">
                                                {getHighlightedText(s.text, syntheticResponse, s.ref)}
                                            </div>
                                            {s.excerpt_explanation && (
                                                <div className="text-[11px] text-stone-600 leading-relaxed border-l-2 border-stone-300 pl-3">
                                                    {s.excerpt_explanation}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                                
                                {showGenealogy && genealogy && (
                                    <>
                                        {genealogy.discursive_shifts?.shifts?.length > 0 && (
                                            <div className="space-y-3">
                                                <h3 className="text-[11px] font-bold text-stone-700 mb-3">Diskursive Brudd</h3>
                                                {genealogy.discursive_shifts.shifts.map((shift, i) => (
                                                    <div key={i} className="bg-white/60 p-4 rounded-sm border-l-2 border-red-300">
                                                        <div className="flex items-center justify-between mb-2">
                                                            <span className="text-[10px] mono font-medium text-stone-700">
                                                                {shift.year_from} → {shift.year_to}
                                                            </span>
                                                            <span className={`text-[9px] mono px-2 py-0.5 rounded ${
                                                                shift.type === 'MAJOR_SHIFT' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'
                                                            }`}>
                                                                {(shift.distance * 100).toFixed(0)}%
                                                            </span>
                                                        </div>
                                                        <div className="text-[10px] text-stone-600">
                                                            {shift.source_a} ↔ {shift.source_b}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        
                                        {selectedConcept && genealogy.concept_genealogies?.[selectedConcept] && (
                                            <div className="space-y-3">
                                                <h3 className="text-[11px] font-bold text-stone-700 mb-3">
                                                    "{selectedConcept}" gjennom tid
                                                </h3>
                                                {genealogy.concept_genealogies[selectedConcept].occurrences.map((occ, i) => (
                                                    <div key={i} className="bg-white/60 p-4 rounded-sm border-l-2 border-purple-300">
                                                        <div className="text-[10px] mono font-medium text-purple-900 mb-2">
                                                            {occ.year} — {occ.source_ref}
                                                        </div>
                                                        <p className="text-[12px] serif italic text-stone-700 leading-relaxed">
                                                            "...{occ.context}..."
                                                        </p>
                                                    </div>
                                                ))}
                                                {genealogy.concept_genealogies[selectedConcept].semantic_drift?.length > 0 && (
                                                    <div className="bg-white/60 p-4 rounded-sm">
                                                        <div className="text-[10px] mono font-medium text-stone-700 mb-2">Semantisk Drift</div>
                                                        {genealogy.concept_genealogies[selectedConcept].semantic_drift.map((drift, i) => (
                                                            <div key={i} className="text-[10px] mono text-stone-600 mb-1">
                                                                {drift.from_year} → {drift.to_year}: <span className={`font-medium ${
                                                                    drift.interpretation === 'STABLE' ? 'text-emerald-600' :
                                                                    drift.interpretation === 'SHIFTING' ? 'text-amber-600' :
                                                                    'text-red-600'
                                                                }`}>{drift.interpretation}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        
                                        {genealogy.power_knowledge && (
                                            <div className="space-y-3">
                                                <h3 className="text-[11px] font-bold text-stone-700 mb-3">Kildefordeling</h3>
                                                <div className="bg-white/60 p-4 rounded-sm space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[10px] mono text-stone-600">Primærkilder</span>
                                                        <span className="text-[14px] font-bold text-sky-700">{genealogy.power_knowledge.hierarchy.PRIMARY}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[10px] mono text-stone-600">Sitater</span>
                                                        <span className="text-[14px] font-bold text-amber-700">{genealogy.power_knowledge.hierarchy.QUOTES}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[10px] mono text-stone-600">Sekundærkilder</span>
                                                        <span className="text-[14px] font-bold text-stone-700">{genealogy.power_knowledge.hierarchy.SECONDARY}</span>
                                                    </div>
                                                    <div className="pt-2 mt-2 border-t border-stone-200">
                                                        <div className="text-[10px] mono text-stone-500 mb-1">Dominant diskurs:</div>
                                                        <div className="text-[11px] text-stone-700">{genealogy.power_knowledge.dominant_discourse}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        </aside>
                    )}

                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-lg z-50 px-4">
                        <div className="glass-membrane rounded-[2rem] p-8 transition-all duration-700 hover:shadow-2xl">
                            <div className="relative">
                                <textarea 
                                    value={documentText} 
                                    onChange={e => setDocumentText(e.target.value)} 
                                    onKeyDown={handleKeyPress} 
                                    placeholder="Indtast genealogisk spørgsmål..." 
                                    className={`w-full text-[16px] serif leading-relaxed text-stone-900 border-none outline-none p-0 placeholder-stone-400 resize-none bg-transparent h-[60px] transition-all ${isSynthesizing ? 'opacity-20' : 'opacity-100'}`}
                                    spellCheck="false" 
                                />
                                <div className="flex justify-end mt-2 gap-2">
                                    {lastQuery && syntheticResponse && (
                                        <button 
                                            onClick={handleTryAgain} 
                                            disabled={isSynthesizing}
                                            className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/10 hover:bg-amber-500/20 disabled:opacity-30 transition-all text-[9px] mono font-medium tracking-wide border border-amber-500/30">
                                            <LucideIcon name="refresh-ccw" size={12} /> Prøv Igen
                                        </button>
                                    )}
                                    <button 
                                        onClick={handleSubmit} 
                                        disabled={isSynthesizing || !documentText.trim()} 
                                        className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-stone-900/5 hover:bg-stone-900/10 disabled:opacity-30 transition-all text-[9px] mono font-medium tracking-wide border border-stone-900/10">
                                        <LucideIcon name="send" size={12} /> {isSynthesizing ? 'Analyserer...' : 'Genealogiser (⌘↵)'}
                                    </button>
                                </div>
                            </div>
                            
                            {syntheticResponse && (
                                <div className="border-t border-stone-300/30 mt-6 pt-6 animate-in fade-in slide-in-from-bottom-2 duration-1000">
                                    <div className="text-[21px] serif italic text-stone-900 leading-snug tracking-tight text-center px-2">
                                        {renderResponseWithVisuals(syntheticResponse)}
                                    </div>
                                    <div className="mt-6 flex justify-between items-center text-[9px] mono text-stone-500">
                                        <span>v.10.4 / REFINED</span>
                                        <button onClick={resetAll} className="hover:text-black transition-all flex items-center gap-1.5 bg-black/5 px-2 py-1 rounded-full">
                                            <LucideIcon name="refresh-cw" size={12} /> RENS
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <footer className="h-8 bg-transparent flex items-center justify-between px-8 text-[8px] mono text-stone-400 fixed bottom-0 w-full z-40 pointer-events-none">
                        <div className="flex gap-8">
                            <span className="text-stone-300">KADK // GENEALOGI</span>
                            {logs.slice(-1).map((log, i) => ( 
                                <span key={i} className="text-stone-400">[{log.time}] {log.msg}</span> 
                            ))}
                        </div>
                        <span className="opacity-30">EPISTEMIC+GENEALOGICAL</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
