<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisker / Diskursmaskine v.8.2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const App = () => {
            const [documentText, setDocumentText] = useState("");
            const [activeStrata, setActiveStrata] = useState([]);
            const [logs, setLogs] = useState([]);
            const [discursiveState, setDiscursiveState] = useState("SEDIMENTERING");
            const [intensity, setIntensity] = useState(0.0);
            const [isSynthesizing, setIsSynthesizing] = useState(false);
            const [syntheticResponse, setSyntheticResponse] = useState("");
            const terminalRef = useRef(null);

            const rams = {
                red: "rgba(227, 34, 25, 0.5)",
                blue: "rgba(0, 107, 180, 0.5)",
                orange: "rgba(255, 160, 0, 0.4)",
                gray: "#f8f8f8",
                black: "#1a1a1a"
            };

            const words_map = useMemo(() => ({
                "bolig": rams.blue, "monumental": rams.blue, "tradisjon": rams.red,
                "tradition": rams.red, "ai": rams.orange, "maskin": rams.orange,
                "disciplin": rams.blue, "social": rams.orange
            }), [rams]);

            const addLog = (msg) => {
                const message = typeof msg === 'string' ? msg : JSON.stringify(msg);
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg: message }].slice(-15));
            };

            useEffect(() => {
                lucide.createIcons();
                if (terminalRef.current) terminalRef.current.scrollTop = terminalRef.current.scrollHeight;
            }, [logs, activeStrata]);

            useEffect(() => {
                if (!documentText.trim()) return;
                const lastChar = documentText.slice(-1);
                if ([" . ", ".", "\n", "?"].includes(lastChar)) executeRealRAG(documentText);
            }, [documentText]);

            const executeRealRAG = async (text) => {
                if (isSynthesizing) return;
                setIsSynthesizing(true);
                addLog(`POST /chat - Analyserer tese...`);
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await response.json();
                    if (data.strata) {
                        setActiveStrata(data.strata.map((s, i) => ({
                            ...s,
                            pos: { x: 20 + (i * 15), y: 25 + (i * 12) },
                            color: s.type === "PRIMARY" ? rams.blue : s.type === "QUOTES" ? rams.orange : rams.red
                        })));
                    }
                    setSyntheticResponse(data.text);
                    setDiscursiveState(data.state);
                    setIntensity(data.intensity);
                    addLog(`Analyse fullført.`);
                } catch (e) {
                    addLog(`Feil: ${e.message}`);
                } finally { setIsSynthesizing(false); }
            };

            return (
                <div className="min-h-screen bg-white text-[#1a1a1a] flex flex-col antialiased font-sans">
                    <style>{`
                        body { font-family: 'Inter', sans-serif; }
                        .serif { font-family: 'Libre Baskerville', serif; }
                        textarea::placeholder { color: #e0e0e0; }
                        .diskurs-field { transition: all 2.5s ease; }
                    `}</style>
                    <header className="h-16 border-b flex items-center justify-between px-8 bg-white z-50">
                        <div className="flex items-center gap-6">
                            <div className="w-6 h-6 bg-[#e32219] flex items-center justify-center text-white font-bold italic">F</div>
                            <h1 className="text-[10px] font-black uppercase tracking-widest">Active Engine 8.2</h1>
                            <span className="text-[10px] font-mono text-blue-500 uppercase">{isSynthesizing ? 'Søger...' : discursiveState}</span>
                        </div>
                        <div className="w-32 h-[1px] bg-gray-100 relative overflow-hidden">
                            <div className="h-full bg-black transition-all duration-1000" style={{ width: `${intensity * 100}%` }}></div>
                        </div>
                    </header>
                    <div className="flex-grow relative overflow-hidden">
                        <div className="absolute inset-0 opacity-10 pointer-events-none">
                            <svg className="w-full h-full">
                                {activeStrata.map((s, i) => <circle key={i} cx={`${s.pos.x}%`} cy={`${s.pos.y}%`} r="20%" fill={s.color} className="diskurs-field" />)}
                            </svg>
                        </div>
                        <div className="absolute inset-0 z-10 pointer-events-none">
                            {activeStrata.map((s, i) => (
                                <div key={i} className="absolute p-4 border-l-2 border-black/5 max-w-[250px]" style={{ left: `${s.pos.x}%`, top: `${s.pos.y}%`, transform: 'translate(-50%, -50%)' }}>
                                    <div className="text-[7px] font-mono text-gray-400 uppercase font-bold">{s.type}</div>
                                    <p className="text-[10px] serif italic text-gray-600 leading-tight">"{s.text.substring(0, 150)}..."</p>
                                    <div className="mt-1 text-[7px] font-mono text-gray-300">{s.ref}</div>
                                </div>
                            ))}
                        </div>
                        <div className="absolute left-8 bottom-8 w-72 z-30 pointer-events-auto bg-white/90 p-4 border text-[8px] font-mono text-gray-400 max-h-40 overflow-y-auto scrollbar-hide shadow-xl">
                            {logs.map((log, i) => <div key={i} className="mb-1">[{log.time}] {log.msg}</div>)}
                        </div>
                        <div className="absolute inset-0 flex items-center justify-center z-20">
                            <div className="max-w-xl w-full">
                                <div className="absolute inset-0 pointer-events-none text-xl serif leading-relaxed text-transparent whitespace-pre-wrap">
                                    {documentText.split(/(\s+)/).map((p, i) => {
                                        const c = words_map[p.toLowerCase().replace(/[.,!?]/g, '')];
                                        return c ? <span key={i} className="border-b border-dotted" style={{ borderColor: c }}>{p}</span> : <span key={i}>{p}</span>;
                                    })}
                                </div>
                                <textarea value={documentText} onChange={e => setDocumentText(e.target.value)} placeholder="Skriv her..." className="w-full text-xl serif leading-relaxed text-black border-none focus:ring-0 p-0 bg-transparent h-[200px] resize-none" />
                                {syntheticResponse && (
                                    <div className="mt-12 animate-in fade-in slide-in-from-bottom-5">
                                        <p className="text-2xl serif italic text-black leading-tight tracking-tight">"{syntheticResponse}"</p>
                                        <div className="mt-4 text-[8px] font-mono font-bold text-gray-300 uppercase">LoRA_ENGINE_FISKER // READY</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
