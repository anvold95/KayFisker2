<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisker / Genealogisk Apparat v.10.2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body className="bg-[#f2f2f2] selection:bg-red-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const LucideIcon = ({ name, className = "", size = 16 }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide?.icons?.[name]) {
                    containerRef.current.innerHTML = '';
                    containerRef.current.innerHTML = window.lucide.icons[name].toSvg({
                        width: size, height: size, class: className
                    });
                }
            }, [name, className, size]);
            return <span ref={containerRef} className="inline-flex items-center justify-center" />;
        };

        const App = () => {
            const [documentText, setDocumentText] = useState("");
            const [lastQuery, setLastQuery] = useState(""); // For "Try Again"
            const [activeStrata, setActiveStrata] = useState([]);
            const [visualNodes, setVisualNodes] = useState([]); 
            const [detectedVisuals, setDetectedVisuals] = useState([]);
            const [genealogy, setGenealogy] = useState(null);
            const [syntheticResponse, setSyntheticResponse] = useState("");
            const [isSynthesizing, setIsSynthesizing] = useState(false);
            const [selectedSources, setSelectedSources] = useState([]);
            const [hoveredSource, setHoveredSource] = useState(null);
            const [logs, setLogs] = useState([]);
            const [expandedVisual, setExpandedVisual] = useState(null);
            const [discursiveState, setDiscursiveState] = useState("SEDIMENTERING");
            const [intensity, setIntensity] = useState(0.0);
            
            // DRAGGING STATE
            const [draggedNode, setDraggedNode] = useState(null);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            
            // GENEALOGICAL VIEW
            const [selectedConcept, setSelectedConcept] = useState(null);
            const [showGenealogy, setShowGenealogy] = useState(false);
            
            const [viewport, setViewport] = useState({ 
                w: typeof window !== 'undefined' ? window.innerWidth : 1200, 
                h: typeof window !== 'undefined' ? window.innerHeight : 800 
            });

            const rams = {
                red: "rgba(227, 34, 25, 0.7)",
                blue: "rgba(0, 107, 180, 0.7)",
                orange: "rgba(255, 160, 0, 0.6)",
                purple: "rgba(147, 51, 234, 0.6)",
                green: "rgba(34, 197, 94, 0.6)"
            };

            const words_map = useMemo(() => ({
                "bolig": rams.blue, "monumental": rams.blue, "tradisjon": rams.red,
                "tradition": rams.red, "funksjonalisme": rams.orange
            }), [rams]);

            const addLog = (msg) => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg }].slice(-3));
            };

            useEffect(() => {
                const onResize = () => setViewport({ w: window.innerWidth, h: window.innerHeight });
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            // ADVANCED COLLISION DETECTION
            const getSmartPosition = (year, existingNodes = []) => {
                const allNodes = [...activeStrata, ...visualNodes, ...existingNodes];
                const yearNum = parseInt(year) || 1950;
                const age = 2024 - yearNum;
                const baseDepth = 15 + Math.min((age / 100) * 60, 60);
                
                const forbiddenZone = { xMin: 20, xMax: 80, yMin: 70, yMax: 100 };
                const nodeWidth = 28;
                const nodeHeight = 20;
                const minDistance = 30;
                
                const isValidPosition = (x, y) => {
                    if (x >= forbiddenZone.xMin && x <= forbiddenZone.xMax &&
                        y >= forbiddenZone.yMin && y <= forbiddenZone.yMax) return false;
                    if (x < 5 || x > 95 || y < 5 || y > 85) return false;
                    
                    for (const node of allNodes) {
                        const dx = Math.abs(node.pos.x - x);
                        const dy = Math.abs(node.pos.y - y);
                        if (dx < minDistance && dy < (nodeHeight + 2)) return false;
                    }
                    return true;
                };
                
                // Concentric circles
                for (let radius = 0; radius <= 40; radius += 10) {
                    for (let i = 0; i < 16; i++) {
                        const angle = (i / 16) * 2 * Math.PI;
                        const x = 50 + radius * Math.cos(angle);
                        const y = baseDepth + radius * 0.5 * Math.sin(angle);
                        if (isValidPosition(x, y)) return { x, y };
                    }
                }
                
                // Grid search
                for (let y = 10; y <= 80; y += 8) {
                    for (let x = 10; x <= 90; x += 8) {
                        if (isValidPosition(x, y)) return { x, y };
                    }
                }
                
                return { x: allNodes.length % 2 === 0 ? 8 : 92, y: baseDepth };
            };

            // DRAG HANDLERS
            const handleMouseDown = (e, nodeId) => {
                if (e.button !== 0) return;
                e.preventDefault();
                const node = activeStrata.find(s => s.id === nodeId);
                if (!node) return;
                
                const rect = e.currentTarget.getBoundingClientRect();
                setDragOffset({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                });
                setDraggedNode(nodeId);
            };

            const handleMouseMove = (e) => {
                if (!draggedNode) return;
                const newX = ((e.clientX - dragOffset.x) / viewport.w) * 100;
                const newY = ((e.clientY - dragOffset.y) / viewport.h) * 100;
                const clampedX = Math.max(5, Math.min(95, newX));
                const clampedY = Math.max(5, Math.min(85, newY));
                
                setActiveStrata(prev => prev.map(s => 
                    s.id === draggedNode ? { ...s, pos: { x: clampedX, y: clampedY } } : s
                ));
            };

            const handleMouseUp = () => {
                setDraggedNode(null);
            };

            useEffect(() => {
                if (draggedNode) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                    return () => {
                        window.removeEventListener('mousemove', handleMouseMove);
                        window.removeEventListener('mouseup', handleMouseUp);
                    };
                }
            }, [draggedNode, dragOffset]);

            const executeGenealogicalRAG = async (text) => {
                if (isSynthesizing) return;
                const prompt = text || documentText;
                if (!prompt || prompt.trim().length < 3) {
                    addLog("Spørsmål for kort");
                    return;
                }
                
                setLastQuery(prompt); // Gem query for "Try Again"
                setIsSynthesizing(true);
                addLog(`Aktiverer genealogisk analyse...`);

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: prompt })
                    });
                    
                    if (!response.ok) {
                        const err = await response.json();
                        addLog(err.error || "Fejl");
                        setSyntheticResponse(err.text || "");
                        return;
                    }
                    
                    const data = await response.json();
                    
                    const newStrata = [];
                    if (data.strata && Array.isArray(data.strata)) {
                        data.strata.forEach((s, i) => {
                            newStrata.push({
                                ...s,
                                pos: getSmartPosition(s.year, newStrata),
                                color: s.type === "PRIMARY" ? rams.blue : 
                                       s.type === "QUOTES" ? rams.orange : rams.red
                            });
                        });
                        setActiveStrata(newStrata);
                    }

                    setDetectedVisuals(data.visuals || []);
                    setVisualNodes([]);
                    setSyntheticResponse(data.text || "");
                    setDiscursiveState(data.state || "GENEALOGI");
                    setIntensity(data.intensity || 0.8);
                    setGenealogy(data.genealogy || null);
                    setSelectedSources([]);
                    addLog(`Genealogi etableret.`);
                } catch (error) {
                    addLog(`Fejl: ${error.message}`);
                } finally {
                    setIsSynthesizing(false);
                }
            };

            // TRY AGAIN FUNCTION
            const handleTryAgain = () => {
                if (!lastQuery) return;
                executeGenealogicalRAG(lastQuery);
            };

            // VISUAL SPAWNING
            const spawnVisual = (visual) => {
                if (visualNodes.find(v => v.keyword === visual.keyword)) return;
                const pos = getSmartPosition(1960, visualNodes);
                const newNode = {
                    ...visual,
                    id: `vis-${Date.now()}`,
                    pos: pos
                };
                setVisualNodes(prev => [...prev, newNode]);
                addLog(`Projiserer: ${visual.keyword}`);
            };

            const renderResponseWithVisuals = (text) => {
                if (!detectedVisuals || !detectedVisuals.length) return text;
                const patterns = detectedVisuals.map(v => v.keyword).join("|");
                const regex = new RegExp(`(${patterns})`, "gi");
                const parts = text.split(regex);

                return parts.map((part, i) => {
                    const match = detectedVisuals.find(v => v.keyword.toLowerCase() === part.toLowerCase());
                    if (match) {
                        const isActive = visualNodes.find(n => n.keyword === match.keyword);
                        return (
                            <span 
                                key={i}
                                onClick={() => spawnVisual(match)}
                                className={`cursor-pointer transition-all border-b-2 font-medium mx-0.5 px-1 rounded-sm ${
                                    isActive 
                                        ? 'border-blue-500 text-blue-700 bg-blue-50' 
                                        : 'border-dashed border-gray-400 text-gray-700 hover:border-blue-400 hover:bg-blue-50/50'
                                }`}
                                title="Klik for å projisere bilde"
                            >
                                <LucideIcon name="image" size={14} className="inline mr-1 mb-0.5 opacity-50" />
                                {part}
                            </span>
                        );
                    }
                    return part;
                });
            };

            const toggleSource = (source) => {
                if (draggedNode) return;
                setSelectedSources(prev => {
                    const exists = prev.find(s => s.id === source.id);
                    if (exists) return prev.filter(s => s.id !== source.id);
                    return [...prev, source];
                });
            };

            const closeSidebar = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                setSelectedSources([]);
                setHoveredSource(null);
            };

            // TEXT HIGHLIGHTING
            const getHighlightedText = (fullText, response, sourceRef) => {
                if (!response || !fullText) return <span className="opacity-70 text-[15px]">{fullText}</span>;
                
                let attributedSegments = [];
                if (genealogy && genealogy.source_attributions) {
                    const attr = genealogy.source_attributions.find(a => a.source_ref === sourceRef);
                    if (attr && attr.segments) {
                        attributedSegments = attr.segments.map(s => s.text);
                    }
                }

                const sentences = fullText.split(/([.!?]+)/).filter(Boolean);
                const responseWords = response.toLowerCase().split(' ');
                let reconstructed = [];
                for (let i = 0; i < sentences.length; i += 2) {
                    reconstructed.push((sentences[i] + (sentences[i+1] || "")).trim());
                }

                return reconstructed.map((s, i) => {
                    const isBackendAttributed = attributedSegments.some(seg => 
                        s.includes(seg) || seg.includes(s)
                    );
                    const matchCount = s.toLowerCase().split(' ').filter(w => 
                        responseWords.includes(w) && w.length > 4
                    ).length;
                    const isSoftActivated = matchCount > 1;

                    let className = "opacity-70 text-[15px]";
                    if (isBackendAttributed) {
                        className = "bg-red-100 text-black font-bold border-b-2 border-red-400 text-[15px]";
                    } else if (isSoftActivated) {
                        className = "bg-red-50 text-black border-b border-red-200 text-[15px]";
                    }

                    return <span key={i} className={`transition-all duration-500 mr-1 ${className}`}>{s} </span>;
                });
            };

            const handleSubmit = () => executeGenealogicalRAG(documentText);
            const handleKeyPress = (e) => { 
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleSubmit();
            };

            const resetAll = () => {
                setDocumentText("");
                setLastQuery("");
                setSyntheticResponse("");
                setActiveStrata([]);
                setVisualNodes([]);
                setDetectedVisuals([]);
                setGenealogy(null);
                setSelectedSources([]);
                setSelectedConcept(null);
                setHoveredSource(null);
            };

            // GENEALOGICAL VISUALIZATIONS
            const renderDiscursiveShifts = () => {
                if (!genealogy?.discursive_shifts?.shifts) return null;
                return genealogy.discursive_shifts.shifts.map((shift, i) => {
                    const sourceA = activeStrata.find(s => s.ref === shift.source_a);
                    const sourceB = activeStrata.find(s => s.ref === shift.source_b);
                    if (!sourceA || !sourceB) return null;
                    
                    const strokeColor = shift.type === "MAJOR_SHIFT" ? "#ef4444" : "#f97316";
                    const strokeWidth = shift.type === "MAJOR_SHIFT" ? 4 : 2;
                    
                    return (
                        <g key={`shift-${i}`}>
                            <line 
                                x1={`${sourceA.pos.x}%`} y1={`${sourceA.pos.y}%`}
                                x2={`${sourceB.pos.x}%`} y2={`${sourceB.pos.y}%`}
                                stroke={strokeColor} strokeWidth={strokeWidth}
                                strokeDasharray="12,6" opacity="0.7"
                            />
                            <text 
                                x={`${(sourceA.pos.x + sourceB.pos.x) / 2}%`}
                                y={`${(sourceA.pos.y + sourceB.pos.y) / 2}%`}
                                className="text-[10px] fill-red-600 font-mono font-black"
                                textAnchor="middle">BRUDD</text>
                        </g>
                    );
                });
            };

            const renderConceptConnections = () => {
                if (!selectedConcept || !genealogy?.concept_genealogies?.[selectedConcept]) return null;
                const conceptData = genealogy.concept_genealogies[selectedConcept];
                const sourceIds = conceptData.occurrences.map(o => o.source_id);
                const connectedNodes = activeStrata.filter(s => sourceIds.includes(s.id));
                
                return connectedNodes.map((node, i) => {
                    if (i === 0) return null;
                    const prev = connectedNodes[i - 1];
                    return (
                        <line key={`concept-${i}`}
                            x1={`${prev.pos.x}%`} y1={`${prev.pos.y}%`}
                            x2={`${node.pos.x}%`} y2={`${node.pos.y}%`}
                            stroke={rams.purple} strokeWidth="3"
                            strokeDasharray="8,4" opacity="0.8"
                        />
                    );
                });
            };

            return (
                <div className="h-screen w-screen flex flex-col relative bg-[#f2f2f2] font-sans overflow-hidden">
                    <style>{`
                        body { font-family: 'Inter', sans-serif; overflow: hidden; background: radial-gradient(circle at center, #fdfdfd 0%, #ebebeb 100%); }
                        .serif { font-family: 'Libre Baskerville', serif; }
                        
                        @keyframes glow-pulse { 0% { opacity: 0.1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(1.1); } 100% { opacity: 0.1; transform: scale(1); } }
                        .animate-glow { animation: glow-pulse 12s ease-in-out infinite; }
                        
                        @keyframes breathe { 0% { opacity: 0; transform: scale(0.8); } 50% { opacity: 0.4; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.3); } }
                        .animate-breathe { animation: breathe 4s ease-in-out infinite; }
                        
                        .glass-membrane { background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05)); backdrop-filter: blur(50px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.1); }
                        
                        .source-node { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); cursor: move; }
                        .source-node:hover { scale: 1.03; z-index: 100; background: rgba(255, 255, 255, 0.95) !important; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15); width: 380px !important; }
                        .source-node.active { border: 2px solid black; box-shadow: 0 20px 60px rgba(0,0,0,0.15); z-index: 50; width: 450px !important; background: rgba(255, 255, 255, 0.95); }
                        .source-node.dragging { opacity: 0.7; cursor: grabbing; z-index: 200; }
                        
                        .visual-node { border-radius: 4px; overflow: hidden; border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); opacity: 0; animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 1.2s; }
                        @keyframes pop-in { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
                        
                        .visual-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw-line 1.5s ease-out forwards; }
                        @keyframes draw-line { to { stroke-dashoffset: 0; } }
                        
                        .epistemic-warning { animation: pulse-warn 2s ease-in-out infinite; }
                        @keyframes pulse-warn { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
                    `}</style>

                    {/* TOPBAR */}
                    <header className="h-12 border-b border-white/40 flex items-center justify-between px-6 z-50 fixed top-0 w-full bg-white/20 backdrop-blur-md">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-2">
                                <div className="w-5 h-5 bg-[#e32219] flex items-center justify-center text-white font-black text-[10px]">F</div>
                                <h1 className="text-[11px] font-extrabold uppercase tracking-[0.4em]">Genealogisk Apparat v.10.2</h1>
                            </div>
                            <span className={`text-[10px] font-bold tracking-widest uppercase ${isSynthesizing ? 'text-blue-500 animate-pulse' : 'text-gray-400'}`}>{discursiveState}</span>
                            
                            {/* EPISTEMIC LEVEL */}
                            {genealogy?.epistemic_levels && (
                                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/5">
                                    <span className={`text-[9px] font-mono font-black tracking-widest ${
                                        genealogy.epistemic_levels.primary_level === 'ARKIVFAKTA' ? 'text-green-600' :
                                        genealogy.epistemic_levels.primary_level === 'ARKIV-NÆR TOLKNING' ? 'text-blue-600' :
                                        'text-orange-600'
                                    }`}>
                                        {genealogy.epistemic_levels.primary_level}
                                    </span>
                                    {genealogy.epistemic_levels.warning && (
                                        <LucideIcon name="alert-triangle" size={11} className="text-orange-500 epistemic-warning" />
                                    )}
                                </div>
                            )}
                        </div>
                        
                        <div className="flex items-center gap-4">
                            {/* GENEALOGY TOGGLE */}
                            <button 
                                onClick={() => setShowGenealogy(!showGenealogy)}
                                className={`px-3 py-1.5 rounded-full text-[9px] font-mono font-bold uppercase tracking-widest transition-all ${
                                    showGenealogy ? 'bg-purple-500 text-white' : 'bg-white/50 text-gray-600 hover:bg-white'
                                }`}
                            >
                                <LucideIcon name="git-branch" size={11} className="inline mr-1.5" />
                                Genealogi
                            </button>
                            
                            <div className="w-16 h-[1px] bg-gray-200 relative overflow-hidden">
                                <div className="h-full bg-black transition-all duration-2000" style={{ width: `${intensity * 100}%` }}></div>
                            </div>
                            
                            {genealogy?.discursive_shifts && (
                                <span className="text-[9px] font-mono text-gray-500 flex items-center gap-1.5">
                                    <LucideIcon name="zap" size={11} className="text-red-500" />
                                    {genealogy.discursive_shifts.shifts.length} BRUDD
                                </span>
                            )}
                        </div>
                    </header>

                    {/* CANVAS */}
                    <main className={`flex-grow relative z-10 transition-all duration-500 ${selectedSources.length > 0 || showGenealogy ? 'mr-[520px]' : 'mr-0'}`} style={{ marginTop: '48px' }}>
                        
                        {/* LOADING PULSE */}
                        {isSynthesizing && (
                            <div className="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
                                <div className="w-[60vh] h-[60vh] rounded-full blur-[100px] bg-gradient-to-tr from-blue-400 to-cyan-200 opacity-20 animate-breathe"></div>
                                <div className="absolute w-[40vh] h-[40vh] rounded-full blur-[80px] bg-blue-100 opacity-30 animate-breathe" style={{animationDelay: '1s'}}></div>
                            </div>
                        )}

                        {/* GLOW HALOS */}
                        <div className="absolute inset-0 z-0 pointer-events-none">
                            {activeStrata.map((s, i) => ( 
                                <div key={`glow-${i}`} className="absolute rounded-full animate-glow blur-[90px]" 
                                    style={{ 
                                        left: `${s.pos.x}%`, top: `${s.pos.y}%`, 
                                        width: '45%', height: '45%', 
                                        background: `radial-gradient(circle, ${s.color} 0%, transparent 85%)`, 
                                        transform: 'translate(-50%, -50%)', 
                                        animationDelay: `${i * 1.5}s`, 
                                        opacity: 0.3 
                                    }} 
                                /> 
                            ))}
                        </div>

                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                            {/* Visual Lines */}
                            {visualNodes.map((v, i) => ( 
                                <path key={`vis-link-${i}`} 
                                    d={`M ${viewport.w / 2} ${viewport.h - 140} Q ${v.pos.x * viewport.w / 100} ${viewport.h - 50} ${v.pos.x * viewport.w / 100} ${v.pos.y * viewport.h / 100}`}
                                    stroke="#3b82f6" strokeWidth="2" fill="none" 
                                    className="visual-line opacity-60" 
                                /> 
                            ))}
                            
                            {/* Genealogical Connections */}
                            {showGenealogy && renderDiscursiveShifts()}
                            {showGenealogy && renderConceptConnections()}
                            
                            {/* Selected Links */}
                            {selectedSources.length > 1 && selectedSources.map((s, i) => {
                                const next = selectedSources[i + 1];
                                if (!next) return null;
                                return <line key={`link-${i}`} x1={`${s.pos.x}%`} y1={`${s.pos.y}%`} x2={`${next.pos.x}%`} y2={`${next.pos.y}%`} stroke="#0ea5e9" strokeWidth="2.5" opacity="0.6" />;
                            })}

                            {/* Hover Pathways */}
                            {activeStrata.map((s, i) => (hoveredSource === s.id || selectedSources.find(ss => ss.id === s.id)) && ( 
                                <path key={`path-${i}`} 
                                    d={`M ${viewport.w / 2} ${viewport.h - 140} C ${viewport.w / 2} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${s.pos.y * viewport.h / 100}`} 
                                    stroke={s.color} strokeWidth="1.5" fill="none" 
                                    strokeDasharray="5,3" className="animate-in fade-in duration-700" 
                                /> 
                            ))}
                        </svg>

                        {/* SOURCE NODES (større tekst) */}
                        <div className="absolute inset-0 z-20 pointer-events-none">
                            {activeStrata.map((s, i) => {
                                const isSelected = selectedSources.find(ss => ss.id === s.id);
                                const isDragging = draggedNode === s.id;
                                const isDimmed = selectedSources.length > 0 && !isSelected;
                                const attribution = genealogy?.source_attributions?.find(a => a.source_ref === s.ref);
                                const hasAttribution = attribution && attribution.segments && attribution.segments.length > 0;
                                
                                const displayText = s.excerpt || s.text;
                                const textLength = isSelected ? 900 : (hoveredSource === s.id ? 250 : 110);

                                return (
                                    <div key={s.id} 
                                        onMouseDown={(e) => handleMouseDown(e, s.id)}
                                        onClick={() => toggleSource(s)}
                                        onMouseEnter={() => setHoveredSource(s.id)}
                                        onMouseLeave={() => setHoveredSource(null)}
                                        className={`source-node absolute p-6 w-[290px] pointer-events-auto bg-white/40 backdrop-blur-xl border-l-4 border border-white/30 ${
                                            isDragging ? 'dragging' : ''
                                        } ${isDimmed ? 'opacity-30 blur-[1px]' : 'opacity-100'} ${isSelected ? 'active' : 'shadow-sm'}`} 
                                        style={{ 
                                            left: `${s.pos.x}%`, top: `${s.pos.y}%`, 
                                            transform: 'translate(-50%, -50%)', 
                                            borderColor: (hoveredSource === s.id || isSelected) ? s.color : 'rgba(0,0,0,0.05)',
                                            cursor: isDragging ? 'grabbing' : 'move'
                                        }}>
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-[10px] font-mono font-black uppercase tracking-widest" style={{ color: s.color }}>
                                                {s.type}
                                            </span>
                                            <div className="flex items-center gap-2">
                                                {hasAttribution && <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse" title="Brukt i svar"></div>}
                                                {isSelected && <LucideIcon name="check-circle" size={14} className="text-green-600" />}
                                                <span className="text-[10px] font-mono text-gray-400">#{s.year || '?'}</span>
                                                <LucideIcon name="move" size={11} className="text-gray-400 opacity-30" />
                                            </div>
                                        </div>
                                        <p className={`serif italic transition-all duration-500 leading-relaxed ${
                                            hoveredSource === s.id || isSelected ? 'text-[15px] text-black' : 'text-[13px] text-gray-600'
                                        }`}>
                                            "{displayText.substring(0, textLength)}{displayText.length > textLength ? '...' : ''}"
                                        </p>
                                        {s.excerpt_relevance && s.excerpt_relevance > 0.5 && !isSelected && (
                                            <div className="mt-3 text-[9px] font-mono text-blue-600 opacity-60" title={s.excerpt_explanation}>
                                                ↗ {Math.round(s.excerpt_relevance * 100)}% relevant
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* VISUAL NODES */}
                        <div className="absolute inset-0 z-30 pointer-events-none">
                            {visualNodes.map((v) => (
                                <div key={v.id} 
                                    onClick={() => setExpandedVisual(v)} 
                                    className="visual-node absolute w-40 h-32 pointer-events-auto cursor-zoom-in hover:scale-110 transition-all duration-500 bg-white" 
                                    style={{ left: `${v.pos.x}%`, top: `${v.pos.y}%` }}>
                                    <img src={v.url} className="w-full h-full object-cover" alt={v.keyword} />
                                    <div className="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-[10px] p-1.5 font-mono uppercase tracking-widest backdrop-blur-sm">{v.keyword}</div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* EXPANDED VISUAL */}
                    {expandedVisual && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-white/80 backdrop-blur-md animate-in fade-in duration-300" 
                            onClick={() => setExpandedVisual(null)}>
                            <div className="relative max-w-4xl max-h-[80vh] bg-white p-2 shadow-2xl rounded-sm border border-gray-200">
                                <img src={expandedVisual.url} className="max-h-[75vh] w-auto object-contain" alt={expandedVisual.keyword} />
                                <div className="absolute -bottom-10 left-0 text-black">
                                    <h3 className="text-xl serif italic">{expandedVisual.keyword}</h3>
                                    <p className="text-[10px] font-mono uppercase tracking-widest text-gray-500">Arkivmateriale // {expandedVisual.type}</p>
                                </div>
                                <button className="absolute -top-12 right-0 text-black hover:text-red-500 text-[10px] uppercase font-bold tracking-widest flex items-center gap-2">
                                    LUK <LucideIcon name="x" size={16} />
                                </button>
                            </div>
                        </div>
                    )}

                    {/* UNIFIED SIDEBAR */}
                    {(selectedSources.length > 0 || showGenealogy) && (
                        <aside className="fixed right-0 top-12 bottom-0 w-[520px] bg-white border-l border-gray-200 z-40 overflow-y-auto flex flex-col shadow-2xl">
                            <header className="p-6 border-b border-gray-100 sticky top-0 z-10 backdrop-blur-md bg-white/95">
                                <div className="flex justify-between items-center mb-3">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <LucideIcon name={showGenealogy ? "git-branch" : "microscope"} size={19} className="text-red-600" />
                                            <span className="text-[12px] font-black uppercase text-red-600 tracking-[0.2em]">
                                                {showGenealogy ? "Genealogisk Analyse" : "Arbejdsbord"}
                                            </span>
                                        </div>
                                        {selectedSources.length > 0 && (
                                            <h2 className="text-[11px] font-bold uppercase tracking-widest text-gray-500">
                                                {selectedSources.length} kilder valgt
                                            </h2>
                                        )}
                                    </div>
                                    <button onClick={() => { closeSidebar(); setShowGenealogy(false); }} 
                                        className="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center">
                                        <LucideIcon name="x" size={17} />
                                    </button>
                                </div>
                                
                                {/* Concept Selector */}
                                {genealogy?.concept_genealogies && Object.keys(genealogy.concept_genealogies).length > 0 && (
                                    <div className="mt-4">
                                        <label className="text-[10px] font-mono font-bold uppercase tracking-widest text-gray-500 mb-2 block">
                                            Spor Begrep
                                        </label>
                                        <select 
                                            value={selectedConcept || ""}
                                            onChange={(e) => setSelectedConcept(e.target.value || null)}
                                            className="w-full text-[11px] font-mono p-2 border border-gray-300 rounded"
                                        >
                                            <option value="">-- Velg begrep --</option>
                                            {Object.keys(genealogy.concept_genealogies).map(concept => (
                                                <option key={concept} value={concept}>
                                                    {concept} ({genealogy.concept_genealogies[concept].total_occurrences})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                )}
                            </header>
                            
                            <div className="flex-grow overflow-y-auto p-6 space-y-8">
                                {/* SELECTED SOURCES */}
                                {selectedSources.length > 0 && selectedSources.map((s, i) => {
                                    const attr = genealogy?.source_attributions?.find(a => a.source_ref === s.ref);
                                    return (
                                        <div key={s.id} className="space-y-4 pb-8 border-b border-gray-100">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[10px] font-mono font-black uppercase tracking-widest" style={{ color: s.color }}>
                                                    {s.type} // {s.year}
                                                </span>
                                                <span className="text-[10px] font-mono text-gray-400 italic">{s.ref}</span>
                                            </div>
                                            
                                            {attr && (
                                                <div className={`px-3 py-2 rounded text-[10px] font-mono uppercase tracking-widest ${
                                                    attr.confidence === 'high' ? 'bg-green-50 text-green-700 border border-green-200' :
                                                    attr.confidence === 'medium' ? 'bg-blue-50 text-blue-700 border border-blue-200' :
                                                    'bg-orange-50 text-orange-700 border border-orange-200'
                                                }`}>
                                                    <div className="flex items-center gap-2">
                                                        <LucideIcon name="zap" size={11} />
                                                        <span>{attr.epistemic_level}</span>
                                                        <span className="opacity-60">({Math.round(attr.attribution_strength * 100)}%)</span>
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="serif italic leading-relaxed text-gray-800">
                                                {getHighlightedText(s.text, syntheticResponse, s.ref)}
                                            </div>
                                            
                                            {s.excerpt_explanation && (
                                                <div className="p-3 bg-gray-50 rounded text-[11px] text-gray-600 border border-gray-100">
                                                    <span className="font-bold uppercase block mb-1 text-[9px] text-black/40">Excerpt Forklaring</span>
                                                    {s.excerpt_explanation}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                                
                                {/* GENEALOGICAL ANALYSIS */}
                                {showGenealogy && genealogy && (
                                    <>
                                        {/* Discursive Shifts */}
                                        {genealogy.discursive_shifts?.shifts?.length > 0 && (
                                            <div className="space-y-3">
                                                <h3 className="text-[11px] font-black uppercase tracking-widest text-gray-700 flex items-center gap-2">
                                                    <LucideIcon name="zap" size={15} className="text-red-500" />
                                                    Diskursive Brudd
                                                </h3>
                                                {genealogy.discursive_shifts.shifts.map((shift, i) => (
                                                    <div key={i} className={`p-4 rounded border-l-4 ${
                                                        shift.type === 'MAJOR_SHIFT' ? 'bg-red-50 border-red-500' : 'bg-orange-50 border-orange-400'
                                                    }`}>
                                                        <div className="text-[10px] font-mono font-bold text-gray-700">
                                                            {shift.year_from} → {shift.year_to}
                                                        </div>
                                                        <div className="text-[9px] font-mono text-gray-500 mt-1">
                                                            Distance: {(shift.distance * 100).toFixed(1)}% | {shift.type}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        
                                        {/* Concept Genealogy */}
                                        {selectedConcept && genealogy.concept_genealogies?.[selectedConcept] && (
                                            <div className="space-y-3">
                                                <h3 className="text-[11px] font-black uppercase tracking-widest text-purple-700 flex items-center gap-2">
                                                    <LucideIcon name="book-open" size={15} />
                                                    "{selectedConcept}" gjennom tid
                                                </h3>
                                                {genealogy.concept_genealogies[selectedConcept].occurrences.map((occ, i) => (
                                                    <div key={i} className="p-4 bg-purple-50 rounded border-l-4 border-purple-400">
                                                        <div className="text-[10px] font-mono font-bold text-purple-900 mb-2">
                                                            {occ.year} — {occ.source_ref}
                                                        </div>
                                                        <p className="text-[11px] serif italic text-gray-700 leading-relaxed">
                                                            "...{occ.context}..."
                                                        </p>
                                                    </div>
                                                ))}
                                                
                                                {genealogy.concept_genealogies[selectedConcept].semantic_drift?.length > 0 && (
                                                    <div className="mt-3 p-4 bg-blue-50 rounded">
                                                        <div className="text-[10px] font-mono font-bold text-blue-900 mb-2">SEMANTISK DRIFT</div>
                                                        {genealogy.concept_genealogies[selectedConcept].semantic_drift.map((drift, i) => (
                                                            <div key={i} className="text-[9px] font-mono text-gray-600">
                                                                {drift.from_year} → {drift.to_year}: <span className={`font-bold ${
                                                                    drift.interpretation === 'STABLE' ? 'text-green-600' :
                                                                    drift.interpretation === 'SHIFTING' ? 'text-orange-600' :
                                                                    'text-red-600'
                                                                }`}>{drift.interpretation}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        
                                        {/* Power/Knowledge */}
                                        {genealogy.power_knowledge && (
                                            <div className="space-y-3">
                                                <h3 className="text-[11px] font-black uppercase tracking-widest text-blue-700 flex items-center gap-2">
                                                    <LucideIcon name="shield" size={15} />
                                                    Makt/Kunnskaps-Neksus
                                                </h3>
                                                <div className="grid grid-cols-3 gap-2">
                                                    <div className="p-3 bg-blue-50 rounded text-center">
                                                        <div className="text-[9px] font-mono text-gray-500">PRIMARY</div>
                                                        <div className="text-[18px] font-black text-blue-600">{genealogy.power_knowledge.hierarchy.PRIMARY}</div>
                                                    </div>
                                                    <div className="p-3 bg-orange-50 rounded text-center">
                                                        <div className="text-[9px] font-mono text-gray-500">QUOTES</div>
                                                        <div className="text-[18px] font-black text-orange-600">{genealogy.power_knowledge.hierarchy.QUOTES}</div>
                                                    </div>
                                                    <div className="p-3 bg-red-50 rounded text-center">
                                                        <div className="text-[9px] font-mono text-gray-500">SECONDARY</div>
                                                        <div className="text-[18px] font-black text-red-600">{genealogy.power_knowledge.hierarchy.SECONDARY}</div>
                                                    </div>
                                                </div>
                                                <div className="p-3 bg-gray-50 rounded">
                                                    <div className="text-[10px] font-mono font-bold text-gray-700 mb-1">Dominant Diskurs:</div>
                                                    <div className="text-[11px] font-mono text-gray-600">{genealogy.power_knowledge.dominant_discourse}</div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        </aside>
                    )}

                    {/* INPUT MEMBRANE */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-lg z-50 px-4">
                        <div className="glass-membrane rounded-[2rem] p-8 transition-all duration-700 hover:shadow-2xl">
                            <div className="relative">
                                <textarea 
                                    value={documentText} 
                                    onChange={e => setDocumentText(e.target.value)} 
                                    onKeyDown={handleKeyPress} 
                                    placeholder="Indtast genealogisk spørgsmål..." 
                                    className={`w-full text-[16px] serif leading-relaxed text-black border-none outline-none p-0 placeholder-black/20 resize-none bg-transparent h-[60px] transition-all ${isSynthesizing ? 'opacity-20' : 'opacity-100'}`}
                                    spellCheck="false" 
                                />
                                <div className="flex justify-end mt-2 gap-2">
                                    {lastQuery && syntheticResponse && (
                                        <button 
                                            onClick={handleTryAgain} 
                                            disabled={isSynthesizing}
                                            className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-orange-500/10 hover:bg-orange-500/20 disabled:opacity-30 transition-all text-[9px] font-mono font-bold uppercase tracking-widest border border-orange-500/30">
                                            <LucideIcon name="refresh-ccw" size={12} /> Prøv Igen
                                        </button>
                                    )}
                                    <button 
                                        onClick={handleSubmit} 
                                        disabled={isSynthesizing || !documentText.trim()} 
                                        className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/5 hover:bg-black/10 disabled:opacity-30 transition-all text-[9px] font-mono font-bold uppercase tracking-widest border border-white/20">
                                        <LucideIcon name="send" size={12} /> {isSynthesizing ? 'Analyserer...' : 'Genealogiser (⌘↵)'}
                                    </button>
                                </div>
                            </div>
                            
                            {syntheticResponse && (
                                <div className="border-t border-white/20 mt-6 pt-6 animate-in fade-in slide-in-from-bottom-2 duration-1000">
                                    <div className="flex items-center justify-center gap-3 mb-4 opacity-40">
                                        <div className="h-[0.5px] w-8 bg-black"></div>
                                        <span className="text-[9px] font-mono font-black text-black uppercase tracking-[0.3em]">Arkiv-Respons</span>
                                        <div className="h-[0.5px] w-8 bg-black"></div>
                                    </div>
                                    <div className="text-[21px] serif italic text-gray-900 leading-snug tracking-tight text-center px-2 drop-shadow-sm">
                                        {renderResponseWithVisuals(syntheticResponse)}
                                    </div>
                                    <div className="mt-6 flex justify-between items-center text-[9px] font-mono font-bold text-gray-500 uppercase tracking-widest">
                                        <span className="flex items-center gap-2">
                                            <LucideIcon name="cpu" size={12} className="text-blue-500" /> GENEALOGICAL_v10.2
                                        </span>
                                        <button onClick={resetAll} className="hover:text-black transition-all flex items-center gap-1.5 bg-black/5 px-2 py-1 rounded-full border border-white/20">
                                            <LucideIcon name="refresh-cw" size={12} /> RENS
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <footer className="h-8 bg-transparent flex items-center justify-between px-8 text-[8px] font-bold uppercase tracking-[0.2em] text-gray-400 fixed bottom-0 w-full z-40">
                        <div className="flex gap-8">
                            <span className="text-black/30 font-black">KADK // v.10.2_REFINED</span>
                            {logs.slice(-1).map((log, i) => ( 
                                <span key={i} className="text-black/40">[{log.time}] {log.msg}</span> 
                            ))}
                        </div>
                        <span className="opacity-10 font-mono">EPISTEMIC+GENEALOGICAL</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
