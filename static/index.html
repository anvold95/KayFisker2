<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisker / Diskursmaskine v.8.12 - Genealogical Analysis</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body className="bg-[#f2f2f2] selection:bg-red-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const App = () => {
            const [documentText, setDocumentText] = useState("");
            const [activeStrata, setActiveStrata] = useState([]);
            const [logs, setLogs] = useState([]);
            const [discursiveState, setDiscursiveState] = useState("SEDIMENTERING");
            const [intensity, setIntensity] = useState(0.0);
            const [isSynthesizing, setIsSynthesizing] = useState(false);
            const [syntheticResponse, setSyntheticResponse] = useState("");
            const [selectedSource, setSelectedSource] = useState(null);
            const [hoveredSource, setHoveredSource] = useState(null);
            const [genealogy, setGenealogy] = useState(null);
            const [showAnalysis, setShowAnalysis] = useState(false);
            
            const [viewport, setViewport] = useState({ 
                w: typeof window !== 'undefined' ? window.innerWidth : 1200, 
                h: typeof window !== 'undefined' ? window.innerHeight : 800 
            });

            const terminalRef = useRef(null);

            const rams = {
                red: "rgba(227, 34, 25, 0.7)",
                blue: "rgba(0, 107, 180, 0.7)",
                orange: "rgba(255, 160, 0, 0.6)",
                black: "#1a1a1a"
            };

            const words_map = useMemo(() => ({
                "bolig": rams.blue, "monumental": rams.blue, "tradisjon": rams.red,
                "tradition": rams.red, "ai": rams.orange, "maskin": rams.orange,
                "disciplin": rams.blue, "social": rams.orange
            }), [rams]);

            const addLog = (msg) => {
                const message = typeof msg === 'string' ? msg : JSON.stringify(msg);
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg: message }].slice(-3));
            };

            useEffect(() => {
                const onResize = () => setViewport({ w: window.innerWidth, h: window.innerHeight });
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            const getRandomNonOverlappingPos = (existing) => {
                let attempts = 0;
                while (attempts < 100) {
                    const pos = { x: 8 + Math.random() * 75, y: 12 + Math.random() * 38 };
                    const isOverlapping = existing.some(e => {
                        const dx = Math.abs(e.pos.x - pos.x);
                        const dy = Math.abs(e.pos.y - pos.y);
                        return dx < 22 && dy < 18;
                    });
                    if (!isOverlapping) return pos;
                    attempts++;
                }
                return { x: Math.random() * 80, y: Math.random() * 40 };
            };

            useEffect(() => {
                lucide.createIcons();
            }, [activeStrata, syntheticResponse, isSynthesizing, selectedSource, showAnalysis]);

            const executeGenealogicalRAG = async (text) => {
                if (isSynthesizing) return;
                if (!text || text.trim().length < 3) {
                    addLog("Spørsmål for kort");
                    return;
                }
                
                setIsSynthesizing(true);
                addLog(`Aktiverer arkiv-strata...`);

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    
                    if (!response.ok) {
                        const err = await response.json();
                        addLog(err.error || "Fejl i forespørgsel");
                        return;
                    }
                    
                    const data = await response.json();
                    
                    if (data.strata) {
                        const positionedStrata = [];
                        data.strata.forEach((s, i) => {
                            positionedStrata.push({
                                ...s,
                                pos: getRandomNonOverlappingPos(positionedStrata),
                                color: s.type === "PRIMARY" ? rams.blue : s.type === "QUOTES" ? rams.orange : rams.red
                            });
                        });
                        setActiveStrata(positionedStrata);
                    }

                    setSyntheticResponse(data.text);
                    setDiscursiveState(data.state || "FRIKSJON");
                    setIntensity(data.intensity || 0.4);
                    setGenealogy(data.genealogy || null);
                    addLog(`Respons etableret.`);
                } catch (error) {
                    addLog(`Forbindelsesfejl: ${error.message}`);
                } finally {
                    setIsSynthesizing(false);
                }
            };

            const handleSubmit = () => {
                executeGenealogicalRAG(documentText);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                    handleSubmit();
                }
            };

            return (
                <div className="h-screen w-screen flex flex-col relative bg-[#f2f2f2] font-sans overflow-hidden">
                    <style>{`
                        body { font-family: 'Inter', sans-serif; overflow: hidden; background: radial-gradient(circle at center, #fdfdfd 0%, #ebebeb 100%); }
                        .serif { font-family: 'Libre Baskerville', serif; }
                        textarea::placeholder { color: #aaa; }
                        @keyframes glow-pulse { 0% { opacity: 0.1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(1.1); } 100% { opacity: 0.1; transform: scale(1); } }
                        .animate-glow { animation: glow-pulse 12s ease-in-out infinite; }
                        
                        .glass-membrane { 
                            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
                            backdrop-filter: blur(50px) saturate(180%);
                            -webkit-backdrop-filter: blur(50px) saturate(180%);
                            border: 1px solid rgba(255, 255, 255, 0.3);
                            border-top: 1px solid rgba(255, 255, 255, 0.5);
                            box-shadow: 
                                0 20px 50px rgba(0, 0, 0, 0.15), 
                                inset 0 0 15px rgba(255, 255, 255, 0.1);
                        }
                        
                        .source-node { 
                            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
                            border-radius: 4px 16px 16px 4px; 
                        }
                        .source-node:hover { 
                            scale: 1.08; 
                            z-index: 100; 
                            background: rgba(255, 255, 255, 0.9) !important; 
                            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1); 
                        }
                        @keyframes scan-line { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
                        .scan-line { animation: scan-line 10s linear infinite; }
                        
                        .analysis-panel {
                            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.1));
                            backdrop-filter: blur(40px);
                            border-left: 2px solid rgba(227, 34, 25, 0.3);
                        }
                    `}</style>

                    {/* STATUS BAR */}
                    <header className="h-9 border-b border-white/40 flex items-center justify-between px-6 z-50 fixed top-0 w-full bg-white/20 backdrop-blur-md">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-[#e32219] flex items-center justify-center text-white font-black italic text-[6px]">F</div>
                                <h1 className="text-[6px] font-extrabold uppercase tracking-[0.4em] text-black">Apparat 8.12</h1>
                            </div>
                            <span className={`text-[6px] font-bold tracking-widest uppercase ${isSynthesizing ? 'text-orange-500 animate-pulse' : 'text-gray-400'}`}>
                                {discursiveState}
                            </span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-[1px] bg-gray-200 relative overflow-hidden">
                                <div className="h-full bg-black transition-all duration-2000" style={{ width: `${intensity * 100}%` }}></div>
                            </div>
                            {genealogy && (
                                <button 
                                    onClick={() => setShowAnalysis(!showAnalysis)}
                                    className="text-[6px] font-mono uppercase tracking-widest hover:text-red-500 transition-colors flex items-center gap-1"
                                >
                                    <i data-lucide="git-branch" className="w-2.5 h-2.5"></i>
                                    {showAnalysis ? 'SKJUL' : 'GENEALOGI'}
                                </button>
                            )}
                            <span className="text-[6px] font-mono text-gray-400 uppercase tracking-widest italic">KADK RESEARCH</span>
                        </div>
                    </header>

                    {/* ARCHIVE CANVAS */}
                    <main className={`flex-grow relative z-10 transition-colors duration-1000 ${selectedSource ? 'bg-black/5' : 'bg-transparent'} ${showAnalysis ? 'mr-96' : ''}`}>
                        
                        {isSynthesizing && <div className="absolute inset-0 z-0 pointer-events-none overflow-hidden opacity-10"><div className="w-full h-1 bg-red-500 scan-line blur-[2px]"></div></div>}

                        {/* HALO GLOWS */}
                        <div className="absolute inset-0 z-0 pointer-events-none">
                            {activeStrata.map((s, i) => (
                                <div 
                                    key={`glow-${i}`}
                                    className="absolute rounded-full animate-glow blur-[90px]"
                                    style={{ 
                                        left: `${s.pos.x}%`, 
                                        top: `${s.pos.y}%`, 
                                        width: '45%', 
                                        height: '45%', 
                                        background: `radial-gradient(circle, ${s.color} 0%, transparent 85%)`,
                                        transform: 'translate(-50%, -50%)',
                                        animationDelay: `${i * 1.5}s`,
                                        opacity: 0.3
                                    }}
                                />
                            ))}
                        </div>

                        {/* CONNECTION PATHS */}
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                            {activeStrata.map((s, i) => (hoveredSource === s.id || selectedSource?.id === s.id) && (
                                <path 
                                    key={`path-${i}`}
                                    d={`M ${viewport.w / 2} ${viewport.h - 140} C ${viewport.w / 2} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${s.pos.y * viewport.h / 100}`}
                                    stroke={s.color} 
                                    strokeWidth="1.2"
                                    fill="none"
                                    strokeDasharray="4,4"
                                    className="animate-in fade-in duration-700"
                                />
                            ))}
                        </svg>

                        {/* SOURCE NODES */}
                        <div className="absolute inset-0 z-20 pointer-events-none">
                            {activeStrata.map((s, i) => {
                                const isFocused = selectedSource?.id === s.id;
                                const isDimmed = selectedSource && !isFocused;
                                
                                // Finn attribution for denne kilden
                                const attribution = genealogy?.source_attributions?.find(a => a.source_ref === s.ref);
                                const hasAttribution = attribution && attribution.segments.length > 0;
                                
                                return (
                                    <div 
                                        key={s.id} 
                                        onClick={() => setSelectedSource(isFocused ? null : s)}
                                        onMouseEnter={() => setHoveredSource(s.id)}
                                        onMouseLeave={() => setHoveredSource(null)}
                                        className={`source-node absolute p-5 border-l-[3px] max-w-[280px] pointer-events-auto cursor-pointer bg-white/40 backdrop-blur-xl border border-white/30 ${isDimmed ? 'opacity-5 blur-sm' : 'opacity-100'} ${hoveredSource === s.id ? 'border-black' : 'border-black/5 shadow-sm'}`} 
                                        style={{ 
                                            left: `${s.pos.x}%`, 
                                            top: `${s.pos.y}%`, 
                                            transform: 'translate(-50%, -50%)',
                                            borderColor: (hoveredSource === s.id || isFocused) ? s.color : 'rgba(0,0,0,0.05)',
                                        }}
                                    >
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-[6px] font-mono text-gray-400 uppercase font-black tracking-widest">{s.type}</span>
                                            <div className="flex items-center gap-2">
                                                {hasAttribution && (
                                                    <div className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse" title="Brukt i svar"></div>
                                                )}
                                                <span className="text-[6px] font-mono text-gray-300">#{s.year || 'ARKIV'}</span>
                                            </div>
                                        </div>
                                        <p className={`serif italic transition-all duration-500 leading-snug ${hoveredSource === s.id || isFocused ? 'text-[13px] text-black' : 'text-[10px] text-gray-400'}`}>
                                            "{hoveredSource === s.id || isFocused ? s.text : s.text.substring(0, 90) + '...'}"
                                        </p>
                                        {(hoveredSource === s.id || isFocused) && (
                                            <div className="mt-3 pt-2 border-t border-black/5">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-[5px] font-bold uppercase tracking-widest text-red-500">RELATION IDENTIFICERET</span>
                                                    <span className="text-[6px] font-mono text-gray-400 italic">{s.ref}</span>
                                                </div>
                                                {hasAttribution && (
                                                    <div className="mt-2 text-[6px] font-mono text-gray-500">
                                                        Styrke: {(attribution.attribution_strength * 100).toFixed(0)}%
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* GENEALOGICAL ANALYSIS PANEL */}
                    {showAnalysis && genealogy && (
                        <aside className="fixed right-0 top-9 bottom-0 w-96 analysis-panel z-40 overflow-y-auto p-6">
                            <div className="space-y-6">
                                <div>
                                    <h3 className="text-[8px] font-black uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <i data-lucide="git-branch" className="w-3 h-3 text-red-500"></i>
                                        Genealogisk Analyse
                                    </h3>
                                </div>

                                {/* Response Grounding */}
                                <div className="bg-white/30 rounded-lg p-4">
                                    <div className="text-[7px] font-bold uppercase tracking-widest text-gray-500 mb-2">Forankring</div>
                                    <div className="flex items-center gap-2">
                                        <div className="flex-grow h-1.5 bg-gray-200 rounded-full overflow-hidden">
                                            <div 
                                                className="h-full bg-gradient-to-r from-red-500 to-blue-500 transition-all duration-1000"
                                                style={{ width: `${(genealogy.response_grounding?.score || 0) * 100}%` }}
                                            ></div>
                                        </div>
                                        <span className="text-[8px] font-mono font-bold">{genealogy.response_grounding?.assessment}</span>
                                    </div>
                                    <p className="text-[7px] text-gray-600 mt-2 leading-relaxed">
                                        Responsen er <strong>{genealogy.response_grounding?.assessment?.toLowerCase()}</strong> forankret i arkivmaterialet
                                    </p>
                                </div>

                                {/* Source Attributions */}
                                {genealogy.source_attributions && genealogy.source_attributions.length > 0 && (
                                    <div>
                                        <div className="text-[7px] font-bold uppercase tracking-widest text-gray-500 mb-3">Brukte Segmenter</div>
                                        <div className="space-y-3">
                                            {genealogy.source_attributions.map((attr, i) => (
                                                <div key={i} className="bg-white/40 rounded-lg p-3 border border-black/5">
                                                    <div className="text-[6px] font-mono text-gray-400 mb-1">{attr.source_ref}</div>
                                                    {attr.segments.slice(0, 2).map((seg, j) => (
                                                        <div key={j} className="mt-2">
                                                            <div className="text-[7px] italic text-gray-700 leading-relaxed">"{seg.text}"</div>
                                                            <div className="text-[6px] font-mono text-gray-400 mt-1">
                                                                Likhet: {(seg.similarity * 100).toFixed(0)}%
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Source Comparisons */}
                                {genealogy.source_comparisons && genealogy.source_comparisons.length > 0 && (
                                    <div>
                                        <div className="text-[7px] font-bold uppercase tracking-widest text-gray-500 mb-3">Kilde-Relasjoner</div>
                                        <div className="space-y-2">
                                            {genealogy.source_comparisons.map((comp, i) => (
                                                <div key={i} className="bg-white/30 rounded p-2 text-[7px]">
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="font-mono text-gray-600">{comp.source_a.split('(')[0]}</span>
                                                        <i data-lucide="arrow-right" className="w-2 h-2 text-gray-400"></i>
                                                        <span className="font-mono text-gray-600">{comp.source_b.split('(')[0]}</span>
                                                    </div>
                                                    <div className="text-[6px] uppercase tracking-wider font-bold" style={{ color: comp.relation_type === 'KONVERGENT' ? '#e32219' : '#006bb4' }}>
                                                        {comp.relation_type} ({(comp.similarity * 100).toFixed(0)}%)
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Query-Source Relations */}
                                {genealogy.query_source_relations && (
                                    <div>
                                        <div className="text-[7px] font-bold uppercase tracking-widest text-gray-500 mb-3">Relevans til Spørsmål</div>
                                        <div className="space-y-1.5">
                                            {genealogy.query_source_relations.map((rel, i) => (
                                                <div key={i} className="flex items-center justify-between text-[7px] bg-white/20 rounded p-2">
                                                    <span className="font-mono text-gray-600">{rel.source_ref.split('(')[0]}</span>
                                                    <span className={`font-bold uppercase tracking-wider ${rel.relevance_category === 'HØY' ? 'text-green-600' : rel.relevance_category === 'MEDIUM' ? 'text-orange-500' : 'text-gray-400'}`}>
                                                        {rel.relevance_category}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </aside>
                    )}

                    {/* FLOATING GLASS OPERATING MEMBRANE */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-lg z-50 px-4">
                        <div className="glass-membrane rounded-[2rem] p-8 transition-all duration-700 hover:shadow-2xl group">
                            
                            {/* Input Area */}
                            <div className="relative">
                                <div className="absolute inset-0 pointer-events-none select-none text-lg serif leading-relaxed text-transparent whitespace-pre-wrap break-words">
                                    {documentText.split(/(\s+)/).map((part, i) => {
                                        const clean = part.toLowerCase().replace(/[.,!?]/g, '');
                                        const color = words_map[clean];
                                        const isResonant = hoveredSource && activeStrata.find(s => s.id === hoveredSource)?.text.toLowerCase().includes(clean);
                                        
                                        return color ? (
                                            <span key={i} className={`border-b-2 transition-all duration-500 ${isResonant ? 'bg-yellow-50/20 brightness-110 opacity-100' : 'opacity-40'}`} style={{ borderColor: color, borderStyle: isResonant ? 'solid' : 'dotted' }}>{part}</span>
                                        ) : <span key={i}>{part}</span>;
                                    })}
                                </div>

                                <textarea 
                                    value={documentText} 
                                    onChange={e => setDocumentText(e.target.value)}
                                    onKeyDown={handleKeyPress}
                                    placeholder="Indtast arkitektonisk tese..." 
                                    className={`w-full text-lg serif leading-relaxed text-black border-none focus:ring-0 p-0 placeholder-black/20 resize-none bg-transparent h-[50px] transition-all ${isSynthesizing ? 'opacity-20' : 'opacity-100'}`}
                                    spellCheck="false"
                                />
                                
                                {/* Submit Button */}
                                <div className="flex justify-end mt-2">
                                    <button
                                        onClick={handleSubmit}
                                        disabled={isSynthesizing || !documentText.trim()}
                                        className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/5 hover:bg-black/10 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-[7px] font-mono font-bold uppercase tracking-widest border border-white/20"
                                    >
                                        <i data-lucide="send" className="w-2.5 h-2.5"></i>
                                        {isSynthesizing ? 'Analyserer...' : 'Send (⌘↵)'}
                                    </button>
                                </div>
                            </div>

                            {/* Response Area */}
                            {syntheticResponse && (
                                <div className="border-t border-white/20 mt-6 pt-6 animate-in fade-in slide-in-from-bottom-2 duration-1000">
                                    <div className="flex items-center justify-center gap-3 mb-4 opacity-40">
                                        <div className="h-[0.5px] w-8 bg-black"></div>
                                        <span className="text-[7px] font-mono font-black text-black uppercase tracking-[0.3em]">Arkiv-Respons</span>
                                        <div className="h-[0.5px] w-8 bg-black"></div>
                                    </div>
                                    <p className="text-xl serif italic text-gray-900 leading-tight tracking-tight text-center px-2 drop-shadow-sm">
                                        "{syntheticResponse}"
                                    </p>
                                    <div className="mt-6 flex justify-between items-center text-[6px] font-mono font-bold text-gray-500 uppercase tracking-widest">
                                        <span className="flex items-center gap-2">
                                            <i data-lucide="cpu" className="w-2.5 h-2.5 text-red-500"></i>
                                             LORA_GENEALOGICAL_8.12
                                        </span>
                                        <button 
                                            onClick={() => {
                                                setDocumentText(""); 
                                                setSyntheticResponse(""); 
                                                setActiveStrata([]);
                                                setGenealogy(null);
                                                setShowAnalysis(false);
                                            }} 
                                            className="hover:text-black transition-all flex items-center gap-1.5 bg-black/5 px-2 py-1 rounded-full border border-white/20"
                                        >
                                            <i data-lucide="refresh-cw" className="w-2 h-2"></i> RENS
                                        </button>
                                    </div>
                                </div>
                            )}
                            
                            <div className="absolute bottom-2 right-8 opacity-0 group-hover:opacity-20 transition-opacity">
                                <i data-lucide="shield" className="w-3 h-3 text-black"></i>
                            </div>
                        </div>
                    </div>

                    {/* SUBTLE LOGS IN FOOTER */}
                    <footer className="h-6 bg-transparent flex items-center justify-between px-8 text-[6px] font-bold uppercase tracking-[0.2em] text-gray-400 fixed bottom-0 w-full z-40">
                        <div className="flex gap-8">
                            <span className="text-black/30 flex items-center gap-2 font-black">KADK // DISKURS_APPARAT</span>
                            {logs.slice(-1).map((log, i) => (
                                <span key={i} className="text-black/40 animate-pulse">[{log.time}] {log.msg}</span>
                            ))}
                        </div>
                        <span className="opacity-10 font-mono tracking-tighter">STABLE_BUILD_8.12.0_GENEALOGY</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
