<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spør Fisker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50 text-neutral-900 flex items-center justify-center min-h-screen p-6">

  <div class="bg-white shadow-2xl rounded-3xl w-full max-w-2xl h-full max-h-[90vh] flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-4 border-b border-neutral-200">
      <h1 class="text-3xl font-semibold tracking-tight">Spør Fisker</h1>
    </div>

    <!-- Chat og status -->
    <div class="flex-grow flex flex-col">

      <!-- Status -->
      <div id="status" class="px-6 py-2 text-sm text-neutral-500">
        Modellen laster inn …
      </div>

      <!-- Chatcontainer -->
      <div id="chat" class="flex-grow px-6 py-4 overflow-y-auto space-y-3 scrollbar-thin scrollbar-thumb-neutral-300 bg-neutral-100">
        <!-- Meldinger kommer her -->
      </div>

    </div>

    <!-- Inputfelt -->
    <div class="px-6 py-4 border-t border-neutral-200 bg-neutral-50">
      <div class="flex gap-3">
        <input id="input" type="text"
          placeholder="Skriv her …"
          class="flex-grow border border-neutral-300 rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-neutral-400" />
        <button id="send"
          class="bg-neutral-900 text-white text-base rounded-2xl px-5 py-3 hover:bg-neutral-800 transition">
          Send
        </button>
      </div>
    </div>

  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const API_URL = window.location.origin + "/chat";

    let modelReady = false;

    async function checkModelStatus() {
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ message: "hej" })
        });
        const data = await res.json();
        if (!data.text.includes("Modellen laster")) {
          modelReady = true;
          statusEl.textContent = "Modellen er klar.";
          statusEl.classList.remove("text-neutral-500");
          statusEl.classList.add("text-green-600");
        } else {
          setTimeout(checkModelStatus, 2000);
        }
      } catch {
        setTimeout(checkModelStatus, 2000);
      }
    }
    checkModelStatus();

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") send();
    });

    async function send() {
      const msg = input.value.trim();
      if (!msg) return;
      addMessage("user", msg);
      input.value = "";
      const botMsg = addMessage("bot", "…");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg }),
        });
        const data = await res.json();
        botMsg.textContent = data.text || "(ingen svar)";
        if (data.audio_url) playAudio(data.audio_url);
      } catch (err) {
        botMsg.textContent = "⚠️ Feil under samtale.";
        console.error(err);
      }

      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `px-4 py-3 rounded-2xl text-base whitespace-pre-wrap leading-relaxed ${
        role === "user"
          ? "bg-neutral-900 text-white self-end"
          : "bg-white text-neutral-900 self-start"
      }`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function playAudio(url) {
      const audio = new Audio(url);
      audio.play().catch(() => console.warn("Kunne ikke spille av lyd:", url));
    }

  </script>

</body>
</html>
