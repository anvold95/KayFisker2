<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spør Fisker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50 text-neutral-900 flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-xl">
    <h1 class="text-lg tracking-tight mb-3">Spør Fisker</h1>

    <!-- Status -->
    <div id="status" class="text-sm text-neutral-500 mb-4">
      Modellen laster inn …
    </div>

    <!-- Chatcontainer -->
    <div id="chat" class="flex flex-col gap-2 bg-white border border-neutral-200 rounded-xl p-4 shadow-sm h-[420px] overflow-y-auto"></div>

    <!-- Inputfelt -->
    <div class="flex mt-4 gap-2">
      <input id="input" type="text" placeholder="Skriv her …" 
        class="flex-grow border border-neutral-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-neutral-400">
      <button id="send" 
        class="bg-neutral-900 text-white text-sm rounded-lg px-4 py-2 hover:bg-neutral-800 transition">
        Send
      </button>
    </div>
  </div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let modelReady = false;

// Sjekk modellstatus hvert 5. sekund
async function checkModelStatus() {
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: "ping" })
    });
    const data = await res.json();
    if (!data.text.includes("Modellen laster")) {
      modelReady = true;
      statusEl.textContent = "Modellen er klar.";
      statusEl.classList.add("text-green-600");
    } else {
      setTimeout(checkModelStatus, 5000);
    }
  } catch {
    setTimeout(checkModelStatus, 5000);
  }
}
checkModelStatus();

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

async function send() {
  const msg = input.value.trim();
  if (!msg) return;
  addMessage("user", msg);
  input.value = "";
  const botMsg = addMessage("bot", "…");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
    });
    const data = await res.json();
    botMsg.textContent = data.text || "(ingen svar)";
    if (data.audio_url) playAudio(data.audio_url);
  } catch (err) {
    botMsg.textContent = "Feil under samtale.";
    console.error(err);
  }
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `px-3 py-2 rounded-lg text-sm whitespace-pre-wrap ${
    role === "user" 
      ? "bg-neutral-100 self-end text-neutral-800" 
      : "bg-neutral-200 self-start text-neutral-800"
  }`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function playAudio(url) {
  const audio = new Audio(url);
  audio.play().catch(() => console.warn("Kunne ikke spille av lyd:", url));
}
</script>
</body>
</html>
