<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisker / Diskursmaskine v.8.9 - Glass Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#f0f0f0] selection:bg-red-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const App = () => {
            const [documentText, setDocumentText] = useState("");
            const [activeStrata, setActiveStrata] = useState([]);
            const [logs, setLogs] = useState([]);
            const [discursiveState, setDiscursiveState] = useState("SEDIMENTERING");
            const [intensity, setIntensity] = useState(0.0);
            const [isSynthesizing, setIsSynthesizing] = useState(false);
            const [syntheticResponse, setSyntheticResponse] = useState("");
            const [selectedSource, setSelectedSource] = useState(null);
            const [hoveredSource, setHoveredSource] = useState(null);
            
            const terminalRef = useRef(null);

            const rams = {
                red: "rgba(227, 34, 25, 0.7)",
                blue: "rgba(0, 107, 180, 0.7)",
                orange: "rgba(255, 160, 0, 0.6)",
                black: "#1a1a1a"
            };

            const words_map = useMemo(() => ({
                "bolig": rams.blue, "monumental": rams.blue, "tradisjon": rams.red,
                "tradition": rams.red, "ai": rams.orange, "maskin": rams.orange,
                "disciplin": rams.blue, "social": rams.orange
            }), [rams]);

            const addLog = (msg) => {
                const message = typeof msg === 'string' ? msg : JSON.stringify(msg);
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg: message }].slice(-3));
            };

            // Logikk for å unngå overlapping av kilder (Spatial distribution)
            const getRandomNonOverlappingPos = (existing) => {
                let attempts = 0;
                while (attempts < 100) {
                    const pos = { x: 8 + Math.random() * 75, y: 12 + Math.random() * 45 };
                    const isOverlapping = existing.some(e => {
                        const dx = Math.abs(e.pos.x - pos.x);
                        const dy = Math.abs(e.pos.y - pos.y);
                        return dx < 22 && dy < 18;
                    });
                    if (!isOverlapping) return pos;
                    attempts++;
                }
                return { x: Math.random() * 80, y: Math.random() * 50 };
            };

            useEffect(() => {
                lucide.createIcons();
            }, [activeStrata, syntheticResponse, isSynthesizing, selectedSource]);

            useEffect(() => {
                if (!documentText.trim()) return;
                const lastChar = documentText.trim().slice(-1);
                if ([".", "\n", "?"].includes(lastChar)) {
                    executeGenealogicalRAG(documentText);
                }
            }, [documentText]);

            const executeGenealogicalRAG = async (text) => {
                if (isSynthesizing) return;
                setIsSynthesizing(true);
                addLog(`Aktiverer arkiv-strata...`);

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await response.json();
                    
                    if (data.strata) {
                        const positionedStrata = [];
                        data.strata.forEach((s, i) => {
                            positionedStrata.push({
                                ...s,
                                id: `s-${Date.now()}-${i}`,
                                pos: getRandomNonOverlappingPos(positionedStrata),
                                color: s.type === "PRIMARY" ? rams.blue : s.type === "QUOTES" ? rams.orange : rams.red
                            });
                        });
                        setActiveStrata(positionedStrata);
                    }

                    setSyntheticResponse(data.text);
                    setDiscursiveState(data.state || "FRIKSJON");
                    setIntensity(data.intensity || 0.4);
                    addLog(`Respons etableret.`);
                } catch (error) {
                    addLog(`Forbindelsesfejl.`);
                } finally {
                    setIsSynthesizing(false);
                }
            };

            return (
                <div className="h-screen w-screen flex flex-col relative bg-[#f2f2f2] font-sans overflow-hidden">
                    <style>{`
                        body { font-family: 'Inter', sans-serif; overflow: hidden; background: radial-gradient(circle at center, #fdfdfd 0%, #ebebeb 100%); }
                        .serif { font-family: 'Libre Baskerville', serif; }
                        textarea::placeholder { color: #ccc; }
                        @keyframes glow-pulse { 0% { opacity: 0.15; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.15); } 100% { opacity: 0.15; transform: scale(1); } }
                        .animate-glow { animation: glow-pulse 8s ease-in-out infinite; }
                        .glass-effect { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08); }
                        .source-node { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 4px 16px 16px 4px; }
                        .source-node:hover { scale: 1.08; z-index: 100; background: rgba(255, 255, 255, 0.9) !important; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1); }
                        @keyframes scan-line { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
                        .scan-line { animation: scan-line 10s linear infinite; }
                    `}</style>

                    {/* STATUS BAR */}
                    <header class="h-9 border-b border-white/40 flex items-center justify-between px-6 z-50 fixed top-0 w-full bg-white/20 backdrop-blur-md">
                        <div class="flex items-center gap-6">
                            <div class="flex items-center gap-2">
                                <div class="w-3 h-3 bg-[#e32219] flex items-center justify-center text-white font-black italic text-[6px]">F</div>
                                <h1 class="text-[6px] font-extrabold uppercase tracking-[0.4em] text-black">Apparat 8.9</h1>
                            </div>
                            <span class={`text-[6px] font-bold tracking-widest uppercase ${isSynthesizing ? 'text-orange-500 animate-pulse' : 'text-gray-400'}`}>
                                {discursiveState}
                            </span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-[1px] bg-gray-200 relative overflow-hidden">
                                <div class="h-full bg-black transition-all duration-2000" style={{ width: `${intensity * 100}%` }}></div>
                            </div>
                            <span class="text-[6px] font-mono text-gray-400 uppercase tracking-widest italic">KADK RESEARCH UNIT</span>
                        </div>
                    </header>

                    {/* ARCHIVE CANVAS */}
                    <main class={`flex-grow relative z-10 transition-colors duration-1000 ${selectedSource ? 'bg-black/5' : 'bg-transparent'}`}>
                        
                        {isSynthesizing && <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden opacity-10"><div class="w-full h-1 bg-red-500 scan-line blur-[2px]"></div></div>}

                        {/* HALO GLOWS */}
                        <div class="absolute inset-0 z-0 pointer-events-none">
                            {activeStrata.map((s, i) => (
                                <div 
                                    key={`glow-${i}`}
                                    class="absolute rounded-full animate-glow blur-[90px]"
                                    style={{ 
                                        left: `${s.pos.x}%`, 
                                        top: `${s.pos.y}%`, 
                                        width: '45%', 
                                        height: '45%', 
                                        background: `radial-gradient(circle, ${s.color} 0%, transparent 75%)`,
                                        transform: 'translate(-50%, -50%)',
                                        animationDelay: `${i * 1.5}s`
                                    }}
                                />
                            ))}
                        </div>

                        {/* CONNECTION PATHS */}
                        <svg class="absolute inset-0 w-full h-full pointer-events-none z-10">
                            {activeStrata.map((s, i) => (hoveredSource === s.id || selectedSource?.id === s.id) && (
                                <path 
                                    key={`path-${i}`}
                                    d={`M ${window.innerWidth / 2} ${window.innerHeight - 100} C ${window.innerWidth / 2} ${window.innerHeight / 2}, ${s.pos.x * window.innerWidth / 100} ${window.innerHeight / 2}, ${s.pos.x * window.innerWidth / 100} ${s.pos.y * window.innerHeight / 100}`}
                                    stroke={s.color} 
                                    strokeWidth="1.2"
                                    fill="none"
                                    strokeDasharray="4,4"
                                    class="animate-in fade-in duration-700"
                                />
                            ))}
                        </svg>

                        {/* SOURCE NODES */}
                        <div class="absolute inset-0 z-20 pointer-events-none">
                            {activeStrata.map((s, i) => {
                                const isFocused = selectedSource?.id === s.id;
                                const isDimmed = selectedSource && !isFocused;
                                return (
                                    <div 
                                        key={s.id} 
                                        onClick={() => setSelectedSource(isFocused ? null : s)}
                                        onMouseEnter={() => setHoveredSource(s.id)}
                                        onMouseLeave={() => setHoveredSource(null)}
                                        class={`source-node absolute p-5 border-l-[3px] max-w-[280px] animate-drift pointer-events-auto cursor-pointer glass-effect ${isDimmed ? 'opacity-5 blur-sm' : 'opacity-100'} ${hoveredSource === s.id ? 'border-black' : 'border-black/5 shadow-sm'}`} 
                                        style={{ 
                                            left: `${s.pos.x}%`, 
                                            top: `${s.pos.y}%`, 
                                            transform: 'translate(-50%, -50%)',
                                            borderColor: (hoveredSource === s.id || isFocused) ? s.color : 'rgba(0,0,0,0.05)',
                                            animationDelay: `${i * 5}s`
                                        }}
                                    >
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="text-[6px] font-mono text-gray-400 uppercase font-black tracking-widest">{s.type}</span>
                                            <span class="text-[6px] font-mono text-gray-300">#{s.year || 'ARKIV'}</span>
                                        </div>
                                        <p class={`serif italic transition-all duration-500 leading-snug ${hoveredSource === s.id || isFocused ? 'text-[13px] text-black' : 'text-[10px] text-gray-400'}`}>
                                            "{hoveredSource === s.id || isFocused ? s.text : s.text.substring(0, 90) + '...'}"
                                        </p>
                                        {(hoveredSource === s.id || isFocused) && (
                                            <div class="mt-3 pt-2 border-t border-black/5 flex justify-between items-center animate-in fade-in">
                                                <span class="text-[5px] font-bold uppercase tracking-widest text-red-500">RELATION IDENTIFICERET</span>
                                                <span class="text-[6px] font-mono text-gray-400 italic">{s.ref}</span>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* FLOATING GLASS INPUT BOX */}
                    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-lg z-50 px-4">
                        <div class="glass-effect rounded-[1.8rem] p-6 transition-all duration-700 hover:shadow-2xl">
                            
                            {/* Input Area */}
                            <div class="relative">
                                <div class="absolute inset-0 pointer-events-none select-none text-lg serif leading-relaxed text-transparent whitespace-pre-wrap break-words">
                                    {documentText.split(/(\s+)/).map((part, i) => {
                                        const clean = part.toLowerCase().replace(/[.,!?]/g, '');
                                        const color = words_map[clean];
                                        const isResonant = hoveredSource && activeStrata.find(s => s.id === hoveredSource)?.text.toLowerCase().includes(clean);
                                        
                                        return color ? (
                                            <span key={i} class={`border-b-2 transition-all duration-500 ${isResonant ? 'bg-yellow-50 brightness-105' : 'opacity-60'}`} style={{ borderColor: color, borderStyle: isResonant ? 'solid' : 'dotted' }}>{part}</span>
                                        ) : <span key={i}>{part}</span>;
                                    })}
                                </div>

                                <textarea 
                                    value={documentText} 
                                    onChange={e => setDocumentText(e.target.value)} 
                                    placeholder="Indtast arkitektonisk tese..." 
                                    class={`w-full text-lg serif leading-relaxed text-black border-none focus:ring-0 p-0 placeholder-gray-300 resize-none bg-transparent h-[50px] transition-all ${isSynthesizing ? 'opacity-20' : 'opacity-100'}`}
                                    spellCheck="false"
                                />
                            </div>

                            {/* Response Area (Appears within the same bubble) */}
                            {syntheticResponse && (
                                <div class="border-t border-black/5 mt-5 pt-5 animate-in fade-in slide-in-from-bottom-2 duration-700">
                                    <div class="flex items-center justify-center gap-3 mb-4 opacity-30">
                                        <div class="h-[0.5px] w-8 bg-black"></div>
                                        <span class="text-[7px] font-mono font-black text-black uppercase tracking-[0.3em]">Arkiv-Respons</span>
                                        <div class="h-[0.5px] w-8 bg-black"></div>
                                    </div>
                                    <p class="text-xl serif italic text-gray-800 leading-tight tracking-tight text-center px-2">
                                        "{syntheticResponse}"
                                    </p>
                                    <div class="mt-5 flex justify-between items-center text-[6px] font-mono font-bold text-gray-400 uppercase tracking-widest">
                                        <span class="flex items-center gap-2"><i data-lucide="cpu" class="w-2.5 h-2.5 text-red-500"></i> FISKER_ENGINE_8.9</span>
                                        <button onClick={() => {setDocumentText(""); setSyntheticResponse(""); setActiveStrata([]);}} class="hover:text-black transition-all flex items-center gap-1.5 bg-black/5 px-2 py-1 rounded-full">
                                            <i data-lucide="refresh-cw" class="w-2 h-2"></i> RENS
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* SUBTLE LOGS IN FOOTER */}
                    <footer class="h-6 bg-transparent flex items-center justify-between px-8 text-[6px] font-bold uppercase tracking-[0.2em] text-gray-300 fixed bottom-0 w-full z-40">
                        <div class="flex gap-8">
                            <span class="text-black/30 flex items-center gap-2 font-black">KADK // DISKURS_APPARAT</span>
                            {logs.slice(-1).map((log, i) => (
                                <span key={i} class="text-black/40 animate-pulse">[{log.time}] {log.msg}</span>
                            ))}
                        </div>
                        <span class="opacity-10 font-mono">STABLE_BUILD_8.9.0_GLASS</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
