<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisker / Diskursmaskine v.8.13 - Analytical Workbench</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body className="bg-[#f2f2f2] selection:bg-red-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const App = () => {
            const [documentText, setDocumentText] = useState("");
            const [activeStrata, setActiveStrata] = useState([]);
            const [logs, setLogs] = useState([]);
            const [discursiveState, setDiscursiveState] = useState("SEDIMENTERING");
            const [intensity, setIntensity] = useState(0.0);
            const [isSynthesizing, setIsSynthesizing] = useState(false);
            const [syntheticResponse, setSyntheticResponse] = useState("");
            
            // Endret til array for multi-seleksjon (fra v8.13)
            const [selectedSources, setSelectedSources] = useState([]); 
            const [hoveredSource, setHoveredSource] = useState(null);
            
            const [genealogy, setGenealogy] = useState(null);
            
            const [viewport, setViewport] = useState({ 
                w: typeof window !== 'undefined' ? window.innerWidth : 1200, 
                h: typeof window !== 'undefined' ? window.innerHeight : 800 
            });

            const terminalRef = useRef(null);

            const rams = {
                red: "rgba(227, 34, 25, 0.7)",
                blue: "rgba(0, 107, 180, 0.7)",
                orange: "rgba(255, 160, 0, 0.6)",
                black: "#1a1a1a"
            };

            const words_map = useMemo(() => ({
                "bolig": rams.blue, "monumental": rams.blue, "tradisjon": rams.red,
                "tradition": rams.red, "ai": rams.orange, "maskin": rams.orange,
                "disciplin": rams.blue, "social": rams.orange
            }), [rams]);

            const addLog = (msg) => {
                const message = typeof msg === 'string' ? msg : JSON.stringify(msg);
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg: message }].slice(-3));
            };

            useEffect(() => {
                const onResize = () => setViewport({ w: window.innerWidth, h: window.innerHeight });
                window.addEventListener('resize', onResize);
                return () => window.removeEventListener('resize', onResize);
            }, []);

            const getRandomNonOverlappingPos = (existing) => {
                let attempts = 0;
                while (attempts < 100) {
                    const pos = { x: 8 + Math.random() * 75, y: 12 + Math.random() * 38 };
                    const isOverlapping = existing.some(e => {
                        const dx = Math.abs(e.pos.x - pos.x);
                        const dy = Math.abs(e.pos.y - pos.y);
                        return dx < 22 && dy < 18;
                    });
                    if (!isOverlapping) return pos;
                    attempts++;
                }
                return { x: Math.random() * 80, y: Math.random() * 40 };
            };

            useEffect(() => {
                lucide.createIcons();
            }, [activeStrata, syntheticResponse, isSynthesizing, selectedSources]);

            const executeGenealogicalRAG = async (text) => {
                if (isSynthesizing) return;
                const prompt = text || documentText;
                if (!prompt || prompt.trim().length < 3) {
                    addLog("Spørsmål for kort");
                    return;
                }
                
                setIsSynthesizing(true);
                addLog(`Aktiverer arkiv-strata...`);

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: prompt })
                    });
                    
                    if (!response.ok) {
                        const err = await response.json();
                        addLog(err.error || "Fejl i forespørgsel");
                        return;
                    }
                    
                    const data = await response.json();
                    
                    if (data.strata) {
                        const positionedStrata = [];
                        data.strata.forEach((s, i) => {
                            positionedStrata.push({
                                ...s,
                                pos: getRandomNonOverlappingPos(positionedStrata),
                                color: s.type === "PRIMARY" ? rams.blue : s.type === "QUOTES" ? rams.orange : rams.red
                            });
                        });
                        setActiveStrata(positionedStrata);
                    }

                    setSyntheticResponse(data.text);
                    setDiscursiveState(data.state || "FRIKSJON");
                    setIntensity(data.intensity || 0.4);
                    setGenealogy(data.genealogy || null);
                    // Reset selection when new analysis arrives? Or keep? Let's clear to show new relations.
                    setSelectedSources([]); 
                    addLog(`Respons etableret.`);
                } catch (error) {
                    addLog(`Forbindelsesfejl: ${error.message}`);
                } finally {
                    setIsSynthesizing(false);
                }
            };

            const handleSubmit = () => {
                executeGenealogicalRAG(documentText);
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                    handleSubmit();
                }
            };

            // Toggle function for multi-selection (v8.13)
            const toggleSource = (source) => {
                setSelectedSources(prev => {
                    const exists = prev.find(s => s.id === source.id);
                    if (exists) return prev.filter(s => s.id !== source.id);
                    return [...prev, source];
                });
            };

            // Funksjon for å highlighte tekst basert på respons OG backend-genealogi
            const getHighlightedText = (fullText, response, sourceRef) => {
                if (!response) return <span>{fullText}</span>;
                
                // 1. Sjekk backend genealogy først
                let attributedSegments = [];
                if (genealogy && genealogy.source_attributions) {
                    const attr = genealogy.source_attributions.find(a => a.source_ref === sourceRef);
                    if (attr) attributedSegments = attr.segments.map(s => s.text);
                }

                // 2. Fallback til klient-side heuristikk (v8.13 logikk)
                const sentences = fullText.split(/([.!?]+)/).filter(Boolean); // Keep delimiters
                const responseWords = response.toLowerCase().split(' ');

                // Rekonstruer setninger (fordi split med delimiter lager array som ["Setning", ".", "Neste", "!"])
                let reconstructed = [];
                for (let i = 0; i < sentences.length; i += 2) {
                    reconstructed.push((sentences[i] + (sentences[i+1] || "")).trim());
                }

                return reconstructed.map((s, i) => {
                    // Sjekk hard kobling (backend)
                    const isBackendAttributed = attributedSegments.some(seg => s.includes(seg) || seg.includes(s));
                    
                    // Sjekk myk kobling (v8.13 heuristikk)
                    const matchCount = s.toLowerCase().split(' ').filter(w => responseWords.includes(w) && w.length > 4).length;
                    const isSoftActivated = matchCount > 1;

                    let className = "opacity-60"; // Default dim
                    if (isBackendAttributed) className = "bg-red-100 text-black font-bold border-b-2 border-red-400";
                    else if (isSoftActivated) className = "bg-red-50 text-black border-b border-red-200";

                    return (
                        <span key={i} className={`transition-all duration-500 mr-1 ${className}`}>
                            {s}{" "}
                        </span>
                    );
                });
            };

            return (
                <div className="h-screen w-screen flex flex-col relative bg-[#f2f2f2] font-sans overflow-hidden">
                    <style>{`
                        body { font-family: 'Inter', sans-serif; overflow: hidden; background: radial-gradient(circle at center, #fdfdfd 0%, #ebebeb 100%); }
                        .serif { font-family: 'Libre Baskerville', serif; }
                        textarea::placeholder { color: #aaa; }
                        
                        @keyframes glow-pulse { 
                            0% { opacity: 0.1; transform: scale(1); } 
                            50% { opacity: 0.25; transform: scale(1.1); } 
                            100% { opacity: 0.1; transform: scale(1); } 
                        }
                        .animate-glow { animation: glow-pulse 12s ease-in-out infinite; }

                        @keyframes breathe { 
                            0% { opacity: 0; transform: scale(0.8); } 
                            50% { opacity: 0.3; transform: scale(1.1); } 
                            100% { opacity: 0; transform: scale(1.3); } 
                        }
                        .animate-breathe { animation: breathe 4s ease-in-out infinite; }
                        
                        .glass-membrane { 
                            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
                            backdrop-filter: blur(50px) saturate(180%);
                            -webkit-backdrop-filter: blur(50px) saturate(180%);
                            border: 1px solid rgba(255, 255, 255, 0.3);
                            border-top: 1px solid rgba(255, 255, 255, 0.5);
                            box-shadow: 
                                0 20px 50px rgba(0, 0, 0, 0.15), 
                                inset 0 0 15px rgba(255, 255, 255, 0.1);
                        }
                        
                        .source-node { 
                            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
                            border-radius: 4px 16px 16px 4px; 
                        }
                        .source-node:hover { 
                            scale: 1.08; 
                            z-index: 100; 
                            background: rgba(255, 255, 255, 0.9) !important; 
                            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1); 
                        }
                        .source-node.active { border: 2px solid black; box-shadow: 0 0 0 4px rgba(0,0,0,0.05); z-index: 50; }

                        @keyframes scan-line { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
                        .scan-line { animation: scan-line 10s linear infinite; }
                        
                        .analysis-panel {
                            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.9));
                            backdrop-filter: blur(40px);
                            border-left: 1px solid rgba(0,0,0,0.05);
                            box-shadow: -20px 0 50px rgba(0,0,0,0.05);
                        }
                    `}</style>

                    {/* STATUS BAR */}
                    <header className="h-9 border-b border-white/40 flex items-center justify-between px-6 z-50 fixed top-0 w-full bg-white/20 backdrop-blur-md">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-[#e32219] flex items-center justify-center text-white font-black italic text-[6px]">F</div>
                                <h1 className="text-[6px] font-extrabold uppercase tracking-[0.4em] text-black">Apparat 8.13</h1>
                            </div>
                            <span className={`text-[6px] font-bold tracking-widest uppercase ${isSynthesizing ? 'text-orange-500 animate-pulse' : 'text-gray-400'}`}>
                                {discursiveState}
                            </span>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-[1px] bg-gray-200 relative overflow-hidden">
                                <div className="h-full bg-black transition-all duration-2000" style={{ width: `${intensity * 100}%` }}></div>
                            </div>
                            <span className="text-[6px] font-mono text-gray-400 uppercase tracking-widest italic">KADK RESEARCH</span>
                        </div>
                    </header>

                    {/* ARCHIVE CANVAS */}
                    <main className={`flex-grow relative z-10 transition-colors duration-1000 ${selectedSources.length > 0 ? 'bg-black/5 mr-[450px]' : 'bg-transparent mr-0'}`}>
                        
                        {/* PULSE ANIMATION (v8.12 style) */}
                        {isSynthesizing && (
                            <div className="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
                                <div className="w-[60vh] h-[60vh] rounded-full blur-[100px] bg-gradient-to-tr from-blue-100 to-white opacity-20 animate-breathe"></div>
                                <div className="absolute w-[40vh] h-[40vh] rounded-full blur-[80px] bg-red-50 opacity-20 animate-breathe" style={{animationDelay: '1s'}}></div>
                            </div>
                        )}

                        {/* HALO GLOWS */}
                        <div className="absolute inset-0 z-0 pointer-events-none">
                            {activeStrata.map((s, i) => (
                                <div 
                                    key={`glow-${i}`}
                                    className="absolute rounded-full animate-glow blur-[90px]"
                                    style={{ 
                                        left: `${s.pos.x}%`, 
                                        top: `${s.pos.y}%`, 
                                        width: '45%', 
                                        height: '45%', 
                                        background: `radial-gradient(circle, ${s.color} 0%, transparent 85%)`,
                                        transform: 'translate(-50%, -50%)',
                                        animationDelay: `${i * 1.5}s`,
                                        opacity: 0.3
                                    }}
                                />
                            ))}
                        </div>

                        {/* CONNECTION PATHS (v8.13 Style) */}
                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                            {/* Linjer mellom valgte kilder */}
                            {selectedSources.length > 1 && selectedSources.map((s, i) => {
                                const next = selectedSources[i + 1];
                                if (!next) return null;
                                return (
                                    <line 
                                        key={`link-${i}`}
                                        x1={`${s.pos.x}%`} y1={`${s.pos.y}%`}
                                        x2={`${next.pos.x}%`} y2={`${next.pos.y}%`}
                                        stroke="rgba(0,0,0,0.2)"
                                        strokeWidth="1"
                                        strokeDasharray="4,4"
                                        className="animate-in fade-in duration-1000"
                                    />
                                );
                            })}
                            {/* Kurver til hover/selection */}
                            {activeStrata.map((s, i) => (hoveredSource === s.id || selectedSources.find(ss => ss.id === s.id)) && (
                                <path 
                                    key={`path-${i}`}
                                    d={`M ${viewport.w / 2} ${viewport.h - 140} C ${viewport.w / 2} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${viewport.h / 2}, ${s.pos.x * viewport.w / 100} ${s.pos.y * viewport.h / 100}`}
                                    stroke={s.color} 
                                    strokeWidth="1.2"
                                    fill="none"
                                    strokeDasharray="4,4"
                                    className="animate-in fade-in duration-700"
                                />
                            ))}
                        </svg>

                        {/* SOURCE NODES */}
                        <div className="absolute inset-0 z-20 pointer-events-none">
                            {activeStrata.map((s, i) => {
                                const isSelected = selectedSources.find(ss => ss.id === s.id);
                                const isDimmed = selectedSources.length > 0 && !isSelected;
                                
                                // Sjekk backend for "hard" attribution for visuell indikasjon på noden
                                const attribution = genealogy?.source_attributions?.find(a => a.source_ref === s.ref);
                                const hasAttribution = attribution && attribution.segments.length > 0;
                                
                                return (
                                    <div 
                                        key={s.id} 
                                        onClick={() => toggleSource(s)}
                                        onMouseEnter={() => setHoveredSource(s.id)}
                                        onMouseLeave={() => setHoveredSource(null)}
                                        className={`source-node absolute p-5 border-l-[3px] max-w-[280px] pointer-events-auto cursor-pointer bg-white/40 backdrop-blur-xl border border-white/30 ${isDimmed ? 'opacity-30 blur-[1px]' : 'opacity-100'} ${isSelected ? 'active bg-white/80' : 'shadow-sm'}`} 
                                        style={{ 
                                            left: `${s.pos.x}%`, 
                                            top: `${s.pos.y}%`, 
                                            transform: 'translate(-50%, -50%)',
                                            borderColor: (hoveredSource === s.id || isSelected) ? s.color : 'rgba(0,0,0,0.05)',
                                        }}
                                    >
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="text-[6px] font-mono text-gray-400 uppercase font-black tracking-widest">{s.type}</span>
                                            <div className="flex items-center gap-2">
                                                {hasAttribution && (
                                                    <div className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse" title="Brukt i svar"></div>
                                                )}
                                                {isSelected && <i data-lucide="check-circle" className="w-3 h-3 text-green-600"></i>}
                                                <span className="text-[6px] font-mono text-gray-300">#{s.year || 'ARKIV'}</span>
                                            </div>
                                        </div>
                                        <p className={`serif italic transition-all duration-500 leading-snug ${hoveredSource === s.id || isSelected ? 'text-[13px] text-black' : 'text-[10px] text-gray-400'}`}>
                                            "{hoveredSource === s.id || isSelected ? s.text : s.text.substring(0, 90) + '...'}"
                                        </p>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* SIDE PANEL: ANALYTICAL WORKBENCH (v8.13 Style) */}
                    {selectedSources.length > 0 && (
                        <aside className="fixed right-0 top-9 bottom-0 w-[450px] analysis-panel z-40 overflow-y-auto flex flex-col animate-in slide-in-from-right duration-500">
                            <header className="p-6 border-b border-gray-100 flex justify-between items-center bg-white/50 sticky top-0 z-10 backdrop-blur-md">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <i data-lucide="microscope" className="w-3 h-3 text-red-500"></i>
                                        <span className="text-[8px] font-black uppercase text-red-500 tracking-[0.2em]">Genealogisk Arbejdsbord</span>
                                    </div>
                                    <h2 className="text-[10px] font-bold uppercase tracking-widest text-gray-400">{selectedSources.length} Strata valgt</h2>
                                </div>
                                <button onClick={() => setSelectedSources([])} className="w-8 h-8 rounded-full hover:bg-gray-200/50 flex items-center justify-center transition-all">
                                    <i data-lucide="x" className="w-4 h-4 text-gray-500"></i>
                                </button>
                            </header>

                            <div className="flex-grow overflow-y-auto p-8 space-y-12">
                                {selectedSources.map((s, i) => (
                                    <div key={s.id} className="space-y-4 animate-in fade-in slide-in-from-bottom-4" style={{ animationDelay: `${i * 100}ms` }}>
                                        <div className="flex items-center justify-between border-b border-gray-200/50 pb-2">
                                            <span className="text-[7px] font-mono font-black uppercase tracking-widest" style={{ color: s.color }}>{s.type} // {s.year}</span>
                                            <span className="text-[6px] font-mono text-gray-400 italic">{s.ref}</span>
                                        </div>
                                        
                                        {/* TEXT CONTENT WITH HIGHLIGHTING */}
                                        <p className="text-[13px] serif italic leading-relaxed text-gray-800">
                                            {getHighlightedText(s.text, syntheticResponse, s.ref)}
                                        </p>

                                        {/* STATUS BOX */}
                                        <div className="flex gap-4">
                                            <div className="flex-1 p-3 bg-gray-50 rounded text-[8px] text-gray-500 border border-gray-100">
                                                <span className="font-bold uppercase block mb-1 text-black/40">Status i analysen</span>
                                                {genealogy?.source_attributions?.some(a => a.source_ref === s.ref) ? (
                                                    <span className="text-green-700 font-medium">Kilden er aktivt anvendt i genereringen (Genealogisk bekræftet).</span>
                                                ) : (
                                                    <span>Kilden utgjør en del av det passive resonansrommet.</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <footer className="p-6 border-t border-gray-100 bg-white/50">
                                <button className="w-full bg-black text-white text-[9px] font-bold uppercase py-4 tracking-[0.2em] hover:bg-red-600 transition-all flex items-center justify-center gap-3 rounded-sm shadow-xl">
                                    Eksportér Krydsfelt <i data-lucide="download" className="w-3 h-3"></i>
                                </button>
                            </footer>
                        </aside>
                    )}

                    {/* FLOATING GLASS OPERATING MEMBRANE */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-lg z-50 px-4">
                        <div className="glass-membrane rounded-[2rem] p-8 transition-all duration-700 hover:shadow-2xl group">
                            
                            {/* Input Area */}
                            <div className="relative">
                                <div className="absolute inset-0 pointer-events-none select-none text-lg serif leading-relaxed text-transparent whitespace-pre-wrap break-words">
                                    {documentText.split(/(\s+)/).map((part, i) => {
                                        const clean = part.toLowerCase().replace(/[.,!?]/g, '');
                                        const color = words_map[clean];
                                        const isResonant = hoveredSource && activeStrata.find(s => s.id === hoveredSource)?.text.toLowerCase().includes(clean);
                                        
                                        return color ? (
                                            <span key={i} className={`border-b-2 transition-all duration-500 ${isResonant ? 'bg-yellow-50/20 brightness-110 opacity-100' : 'opacity-40'}`} style={{ borderColor: color, borderStyle: isResonant ? 'solid' : 'dotted' }}>{part}</span>
                                        ) : <span key={i}>{part}</span>;
                                    })}
                                </div>

                                <textarea 
                                    value={documentText} 
                                    onChange={e => setDocumentText(e.target.value)}
                                    onKeyDown={handleKeyPress}
                                    placeholder="Indtast arkitektonisk tese..." 
                                    className={`w-full text-lg serif leading-relaxed text-black border-none focus:ring-0 p-0 placeholder-black/20 resize-none bg-transparent h-[50px] transition-all ${isSynthesizing ? 'opacity-20' : 'opacity-100'}`}
                                    spellCheck="false"
                                />
                                
                                {/* Submit Button */}
                                <div className="flex justify-end mt-2">
                                    <button
                                        onClick={handleSubmit}
                                        disabled={isSynthesizing || !documentText.trim()}
                                        className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/5 hover:bg-black/10 disabled:opacity-30 disabled:cursor-not-allowed transition-all text-[7px] font-mono font-bold uppercase tracking-widest border border-white/20"
                                    >
                                        <i data-lucide="send" className="w-2.5 h-2.5"></i>
                                        {isSynthesizing ? 'Analyserer...' : 'Send (⌘↵)'}
                                    </button>
                                </div>
                            </div>

                            {/* Response Area */}
                            {syntheticResponse && (
                                <div className="border-t border-white/20 mt-6 pt-6 animate-in fade-in slide-in-from-bottom-2 duration-1000">
                                    <div className="flex items-center justify-center gap-3 mb-4 opacity-40">
                                        <div className="h-[0.5px] w-8 bg-black"></div>
                                        <span className="text-[7px] font-mono font-black text-black uppercase tracking-[0.3em]">Arkiv-Respons</span>
                                        <div className="h-[0.5px] w-8 bg-black"></div>
                                    </div>
                                    <p className="text-xl serif italic text-gray-900 leading-tight tracking-tight text-center px-2 drop-shadow-sm">
                                        "{syntheticResponse}"
                                    </p>
                                    <div className="mt-6 flex justify-between items-center text-[6px] font-mono font-bold text-gray-500 uppercase tracking-widest">
                                        <span className="flex items-center gap-2">
                                            <i data-lucide="cpu" className="w-2.5 h-2.5 text-red-500"></i>
                                             LORA_GENEALOGICAL_8.13
                                        </span>
                                        <button 
                                            onClick={() => {
                                                setDocumentText(""); 
                                                setSyntheticResponse(""); 
                                                setActiveStrata([]);
                                                setGenealogy(null);
                                                setSelectedSources([]);
                                            }} 
                                            className="hover:text-black transition-all flex items-center gap-1.5 bg-black/5 px-2 py-1 rounded-full border border-white/20"
                                        >
                                            <i data-lucide="refresh-cw" className="w-2 h-2"></i> RENS
                                        </button>
                                    </div>
                                </div>
                            )}
                            
                            <div className="absolute bottom-2 right-8 opacity-0 group-hover:opacity-20 transition-opacity">
                                <i data-lucide="shield" className="w-3 h-3 text-black"></i>
                            </div>
                        </div>
                    </div>

                    {/* SUBTLE LOGS IN FOOTER */}
                    <footer className="h-6 bg-transparent flex items-center justify-between px-8 text-[6px] font-bold uppercase tracking-[0.2em] text-gray-400 fixed bottom-0 w-full z-40">
                        <div className="flex gap-8">
                            <span className="text-black/30 flex items-center gap-2 font-black">KADK // DISKURS_APPARAT</span>
                            {logs.slice(-1).map((log, i) => (
                                <span key={i} className="text-black/40 animate-pulse">[{log.time}] {log.msg}</span>
                            ))}
                        </div>
