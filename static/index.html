<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisker / Genealogisk Apparat v.10.16 (Forskermodus)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body className="bg-[#f2f2f2] selection:bg-red-200 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const LucideIcon = ({ name, className = "", size = 16 }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.lucide?.icons?.[name]) {
                    containerRef.current.innerHTML = '';
                    containerRef.current.innerHTML = window.lucide.icons[name].toSvg({
                        width: size, height: size, class: className
                    });
                }
            }, [name, className, size]);
            return <span ref={containerRef} className="inline-flex items-center justify-center" />;
        };

        const App = () => {
            const [documentText, setDocumentText] = useState("");
            const [lastQuery, setLastQuery] = useState("");
            const [activeStrata, setActiveStrata] = useState([]);
            const [visualNodes, setVisualNodes] = useState([]); 
            const [detectedVisuals, setDetectedVisuals] = useState([]);
            const [genealogy, setGenealogy] = useState(null);
            const [syntheticResponse, setSyntheticResponse] = useState("");
            const [isSynthesizing, setIsSynthesizing] = useState(false);
            const [selectedSources, setSelectedSources] = useState([]);
            const [hoveredSource, setHoveredSource] = useState(null);
            const [logs, setLogs] = useState([]);
            const [expandedVisual, setExpandedVisual] = useState(null);
            const [discursiveState, setDiscursiveState] = useState("SEDIMENTERING");
            const [intensity, setIntensity] = useState(0.0);
            
            const [draggedNode, setDraggedNode] = useState(null);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            
            const [selectedConcept, setSelectedConcept] = useState(null);
            const [showGenealogy, setShowGenealogy] = useState(false);
            const [conversationHistory, setConversationHistory] = useState([]);

            // v10.16: FORSKERMODUS STATE
            const [researchMode, setResearchMode] = useState(false);
            const [searchLog, setSearchLog] = useState(null);
            const [responseComposition, setResponseComposition] = useState(null);
            const [sourceAnalytics, setSourceAnalytics] = useState(null);
            const [showAnalyticsPanel, setShowAnalyticsPanel] = useState(false);

            // URL-parameter gating for forskermodus
            const researchAllowed = useMemo(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('research') === 'true';
            }, []);

            // Modal + popover state
            const [showAboutModal, setShowAboutModal] = useState(false);
            const [showInfoPopover, setShowInfoPopover] = useState(false);

            // Voice / TTS state
            const [isVoicePlaying, setIsVoicePlaying] = useState(false);
            const [isVoiceLoading, setIsVoiceLoading] = useState(false);
            const [voiceAmplitude, setVoiceAmplitude] = useState(0);
            const audioContextRef = useRef(null);
            const analyserRef = useRef(null);
            const animFrameRef = useRef(null);
            const audioElementRef = useRef(null);

            const stopVoice = () => {
                if (audioElementRef.current) {
                    try { audioElementRef.current.stop(); } catch(e) {}
                    audioElementRef.current = null;
                }
                if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                setIsVoicePlaying(false);
                setVoiceAmplitude(0);
            };

            const playVoice = async (text) => {
                if (isVoicePlaying) { stopVoice(); return; }
                setIsVoiceLoading(true);
                try {
                    const resp = await fetch('/tts-elevenlabs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });
                    if (!resp.ok) {
                        const err = await resp.json();
                        addLog(`Stemme-fejl: ${err.error || resp.status}`);
                        return;
                    }
                    const blob = await resp.blob();
                    const arrayBuffer = await blob.arrayBuffer();

                    if (!audioContextRef.current) {
                        audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioContextRef.current;
                    if (ctx.state === 'suspended') await ctx.resume();

                    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                    const source = ctx.createBufferSource();
                    source.buffer = audioBuffer;

                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.8;
                    source.connect(analyser);
                    analyser.connect(ctx.destination);
                    analyserRef.current = analyser;

                    const dataArray = new Uint8Array(analyser.frequencyBinCount);
                    const tick = () => {
                        analyser.getByteFrequencyData(dataArray);
                        const sum = dataArray.reduce((a, b) => a + b, 0);
                        const avg = sum / dataArray.length / 255;
                        setVoiceAmplitude(avg);
                        animFrameRef.current = requestAnimationFrame(tick);
                    };

                    source.onended = () => stopVoice();
                    audioElementRef.current = source;
                    setIsVoicePlaying(true);
                    tick();
                    source.start(0);
                } catch (e) {
                    addLog(`Stemme-fejl: ${e.message}`);
                    stopVoice();
                } finally {
                    setIsVoiceLoading(false);
                }
            };
            
            const [viewport, setViewport] = useState({ 
                w: typeof window !== 'undefined' ? window.innerWidth : 1200, 
                h: typeof window !== 'undefined' ? window.innerHeight : 800 
            });

            const rams = researchMode ? {
                red: "rgba(227, 34, 25, 0.7)",
                blue: "rgba(0, 107, 180, 0.7)",
                orange: "rgba(255, 160, 0, 0.6)",
                green: "rgba(34, 197, 94, 0.6)"
            } : {
                red: "rgba(168, 162, 158, 0.5)",
                blue: "rgba(87, 83, 78, 0.6)",
                orange: "rgba(168, 162, 158, 0.4)",
                green: "rgba(120, 113, 108, 0.5)"
            };

            const addLog = (msg) => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg }].slice(-3));
            };

            // v10.16: Hent kildestatistikk
            const fetchSourceAnalytics = async () => {
                try {
                    const response = await fetch('/source-analytics');
                    if (response.ok) {
                        const data = await response.json();
                        setSourceAnalytics(data);
                        setShowAnalyticsPanel('stats');
                        addLog(`Statistikk: ${data.summary?.unique_sources_cited || 0} kilder`);
                    }
                } catch (error) {
                    addLog(`Statistikk-feil: ${error.message}`);
                }
            };

            // v10.16: Eksporter analyse
            const exportCurrentAnalysis = () => {
                const data = {
                    query: lastQuery,
                    response: syntheticResponse,
                    sources: activeStrata,
                    genealogy: genealogy,
                    searchLog: searchLog,
                    responseComposition: responseComposition,
                    researchMode: researchMode,
                    timestamp: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `fisker-analyse-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                addLog('Analyse eksportert');
            };

            // v10.16: Eksporter sesjon
            const exportSession = async () => {
                try {
                    const res = await fetch('/export-session');
                    if (res.ok) {
                        const data = await res.json();
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `fisker-sesjon-${Date.now()}.json`;
                        a.click();
                        URL.revokeObjectURL(url);
                        addLog('Sesjon eksportert');
                    }
                } catch (e) {
                    addLog(`Eksport-feil: ${e.message}`);
                }
            };

            // v10.16: Render full kildetekst med segment-highlighting
            const renderFullSourceText = (source) => {
                if (!source || !source.text) return null;
                
                const segmentAnalysis = source.segment_analysis;
                const topSegments = segmentAnalysis?.top_contributing || [];
                
                const sentences = source.text.split(/([.!?]+\s+)/).filter(Boolean);
                
                return (
                    <div className="space-y-1 text-[13px] leading-relaxed">
                        {sentences.map((sentence, i) => {
                            const matchingSeg = topSegments.find(seg =>
                                seg.similarity > 0.5 && (
                                    sentence.includes(seg.text?.substring(0, 30) || '') ||
                                    (seg.text || '').includes(sentence.substring(0, 30))
                                )
                            );
                            
                            if (matchingSeg) {
                                const bgColor = matchingSeg.similarity > 0.7 
                                    ? 'bg-sky-100 border-l-4 border-sky-500' 
                                    : matchingSeg.similarity > 0.55 
                                    ? 'bg-sky-100 border-l-4 border-sky-400'
                                    : 'bg-stone-100 border-l-4 border-stone-300';
                                
                                return (
                                    <span key={i} className={`${bgColor} px-2 py-0.5 inline-block my-0.5`}>
                                        {sentence}
                                        <span className="ml-2 text-[9px] mono text-stone-500">
                                            ({Math.round(matchingSeg.similarity * 100)}%)
                                        </span>
                                    </span>
                                );
                            }
                            return <span key={i} className="text-stone-600">{sentence}</span>;
                        })}
                    </div>
                );
            };

            // v10.16: Render respons-komposisjon
            const renderResponseComposition = () => {
                if (!responseComposition || !responseComposition.sentence_attributions) return null;
                
                return (
                    <div className="space-y-4">
                        <h4 className="text-[11px] font-bold text-stone-800 flex items-center gap-2">
                            <LucideIcon name="git-branch" size={14} />
                            Respons-komposisjon ({responseComposition.high_confidence_attributions}/{responseComposition.total_sentences})
                        </h4>
                        
                        <div className="space-y-3">
                            {responseComposition.sentence_attributions.map((attr, i) => (
                                <div key={i} className={`p-3 rounded border-l-4 ${
                                    attr.attribution_confidence === 'DIREKTE_KILDE' ? 'bg-sky-50 border-sky-500' :
                                    attr.attribution_confidence === 'STERK_INDIKASJON' ? 'bg-sky-50/60 border-sky-400' :
                                    attr.attribution_confidence === 'MODERAT_INDIKASJON' ? 'bg-stone-50 border-stone-400' :
                                    'bg-stone-50 border-stone-300'
                                }`}>
                                    <p className="text-[12px] serif text-stone-800 mb-2">"{attr.response_sentence}"</p>
                                    <div className="flex items-center justify-between text-[9px] mono">
                                        <span className={`px-2 py-0.5 rounded ${
                                            attr.attribution_confidence === 'DIREKTE_KILDE' ? 'bg-sky-200 text-sky-800' :
                                            attr.attribution_confidence === 'STERK_INDIKASJON' ? 'bg-sky-200 text-sky-800' :
                                            'bg-stone-200 text-stone-600'
                                        }`}>{attr.attribution_confidence?.replace(/_/g, ' ')}</span>
                                        {attr.best_matching_source?.title && (
                                            <span className="text-stone-500 truncate max-w-[150px]">← {attr.best_matching_source.title}</span>
                                        )}
                                        <span className="text-stone-400">{Math.round(attr.similarity * 100)}%</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };

            // v10.16: Render søkelogg
            const renderSearchLog = () => {
                if (!searchLog) return null;
                return (
                    <div className="space-y-4">
                        <h4 className="text-[11px] font-bold text-stone-800 flex items-center gap-2">
                            <LucideIcon name="search" size={14} />
                            Søkelogg
                        </h4>
                        <div className="space-y-3 text-[10px] mono">
                            <div className="bg-stone-100 p-3 rounded">
                                <div className="text-stone-500 mb-1">Original query:</div>
                                <div className="text-stone-800">{searchLog.query_original}</div>
                            </div>
                            {searchLog.query_enhanced !== searchLog.query_original && (
                                <div className="bg-sky-50 p-3 rounded border border-sky-200">
                                    <div className="text-sky-600 mb-1">Ekspandert til:</div>
                                    <div className="text-sky-800">{searchLog.query_enhanced}</div>
                                </div>
                            )}
                            <div className="bg-white p-3 rounded border border-stone-200">
                                <div className="text-stone-500 mb-2">Namespace-resultater:</div>
                                {Object.entries(searchLog.namespace_results_raw || {}).map(([ns, results]) => (
                                    <div key={ns} className="mb-2">
                                        <div className="font-medium text-stone-700">{ns.toUpperCase()}: {results.length} treff</div>
                                        <div className="pl-3 text-stone-500">
                                            {results.slice(0, 3).map((r, i) => (
                                                <div key={i} className="truncate">• {r.title || 'Ukjent'} - {r.pinecone_score?.toFixed(4)}</div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {searchLog.selection_reasoning?.length > 0 && (
                                <div className="bg-stone-50 p-3 rounded border border-stone-200">
                                    <div className="text-stone-600 mb-2">Seleksjonsresonnement:</div>
                                    {searchLog.selection_reasoning.map((step, i) => (
                                        <div key={i} className="text-stone-700 mb-1">{step.step}. {step.reason} → {step.source}</div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // v10.16: Render statistikk
            const renderSourceAnalytics = () => {
                if (!sourceAnalytics) return (
                    <div className="text-center py-8">
                        <button onClick={fetchSourceAnalytics} className="px-4 py-2 bg-sky-500 text-white rounded-lg hover:bg-sky-600 text-sm">
                            Hent statistikk
                        </button>
                    </div>
                );
                return (
                    <div className="space-y-4">
                        <h4 className="text-[11px] font-bold text-stone-800">📊 Kildestatistikk</h4>
                        <div className="grid grid-cols-3 gap-3">
                            <div className="bg-sky-50 p-3 rounded text-center">
                                <div className="text-2xl font-bold text-sky-700">{sourceAnalytics.summary?.total_queries || 0}</div>
                                <div className="text-[9px] mono text-sky-600">Queries</div>
                            </div>
                            <div className="bg-sky-50 p-3 rounded text-center">
                                <div className="text-2xl font-bold text-sky-700">{sourceAnalytics.summary?.unique_sources_cited || 0}</div>
                                <div className="text-[9px] mono text-sky-600">Unike kilder</div>
                            </div>
                            <div className="bg-stone-50 p-3 rounded text-center">
                                <div className="text-2xl font-bold text-stone-700">{sourceAnalytics.summary?.total_citations || 0}</div>
                                <div className="text-[9px] mono text-stone-600">Siteringer</div>
                            </div>
                        </div>
                        {sourceAnalytics.top_cited_sources?.length > 0 && (
                            <div className="bg-white p-4 rounded border">
                                <h5 className="text-[10px] font-bold mb-3">Mest siterte kilder</h5>
                                {sourceAnalytics.top_cited_sources.slice(0, 10).map((src, i) => (
                                    <div key={i} className="flex justify-between items-center py-2 border-b border-stone-100 last:border-0">
                                        <div className="flex-1 min-w-0">
                                            <div className="text-[11px] font-medium truncate">{src.title || 'Ukjent'}</div>
                                            <div className="text-[9px] text-stone-500">{src.author} ({src.year})</div>
                                        </div>
                                        <div className="text-right ml-2">
                                            <div className="text-[12px] font-bold text-sky-600">{src.citation_count}×</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            useEffect(() => {
                const onResize = () => setViewport({ w: window.innerWidth, h: window.innerHeight });
                window.addEventListener('resize', onResize);
                
                const timer = setTimeout(() => {
                    setViewport({ w: window.innerWidth, h: window.innerHeight });
                }, 100);
                
                return () => {
                    window.removeEventListener('resize', onResize);
                    clearTimeout(timer);
                };
            }, [selectedSources.length, showGenealogy]);

            const getSmartPosition = (year, existingNodes = []) => {
                const allNodes = [...activeStrata, ...visualNodes, ...existingNodes];
                const yearNum = parseInt(year) || 1950;
                const age = 2024 - yearNum;
                const baseDepth = 15 + Math.min((age / 100) * 60, 60);
                
                const forbiddenZone = { xMin: 10, xMax: 90, yMin: 65, yMax: 100 };
                const minDistance = 30;
                
                const isValidPosition = (x, y) => {
                    if (x >= forbiddenZone.xMin && x <= forbiddenZone.xMax &&
                        y >= forbiddenZone.yMin && y <= forbiddenZone.yMax) return false;
                    if (x < 3 || x > 97 || y < 3 || y > 72) return false;
                    
                    for (const node of allNodes) {
                        const dx = Math.abs(node.pos.x - x);
                        const dy = Math.abs(node.pos.y - y);
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < minDistance) return false;
                    }
                    return true;
                };
                
                for (let radius = 0; radius <= 50; radius += 10) {
                    for (let i = 0; i < 28; i++) {
                        const angle = (i / 28) * 2 * Math.PI;
                        const x = 50 + radius * Math.cos(angle);
                        const y = baseDepth + radius * 0.4 * Math.sin(angle);
                        if (isValidPosition(x, y)) return { x, y };
                    }
                }
                
                for (let y = 8; y <= 70; y += 8) {
                    for (let x = 8; x <= 92; x += 8) {
                        if (isValidPosition(x, y)) return { x, y };
                    }
                }
                
                return { x: allNodes.length % 2 === 0 ? 8 : 92, y: 20 };
            };

            const handleMouseDown = (e, nodeId) => {
                if (e.button !== 0) return;
                e.preventDefault();
                const node = activeStrata.find(s => s.id === nodeId);
                if (!node) return;
                
                const rect = e.currentTarget.getBoundingClientRect();
                setDragOffset({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                });
                setDraggedNode(nodeId);
            };

            const handleMouseMove = (e) => {
                if (!draggedNode) return;
                const newX = ((e.clientX - dragOffset.x) / viewport.w) * 100;
                const newY = ((e.clientY - dragOffset.y) / viewport.h) * 100;
                const clampedX = Math.max(5, Math.min(95, newX));
                const clampedY = Math.max(5, Math.min(85, newY));
                
                setActiveStrata(prev => prev.map(s => 
                    s.id === draggedNode ? { ...s, pos: { x: clampedX, y: clampedY } } : s
                ));
            };

            const handleMouseUp = () => {
                setDraggedNode(null);
            };

            useEffect(() => {
                if (draggedNode) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                    return () => {
                        window.removeEventListener('mousemove', handleMouseMove);
                        window.removeEventListener('mouseup', handleMouseUp);
                    };
                }
            }, [draggedNode, dragOffset]);

            const executeGenealogicalRAG = async (text) => {
                if (isSynthesizing) return;
                const prompt = text || documentText;
                if (!prompt || prompt.trim().length < 3) {
                    addLog("Spørgsmål for kort");
                    return;
                }
                
                setLastQuery(prompt);
                setIsSynthesizing(true);
                addLog(`Aktiverer genealogisk analyse...`);

                try {
                    // v10.16: Velg endpoint basert på modus
                    const endpoint = researchMode ? '/research' : '/chat';
                    
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            message: prompt,
                            history: conversationHistory
                        })
                    });
                    
                    if (!response.ok) {
                        const err = await response.json();
                        addLog(err.error || "Fejl");
                        setSyntheticResponse(err.text || "");
                        return;
                    }
                    
                    const data = await response.json();
                    
                    // v10.16: Håndter forskermodus-respons
                    if (researchMode && data.full_sources) {
                        const newStrata = [];
                        data.full_sources.forEach((s, i) => {
                            newStrata.push({
                                ...s,
                                id: s.id || `source_${i}`,
                                text: s.full_text || s.text,
                                year: s.metadata?.year || s.year,
                                type: s.type || 'PRIMARY',
                                score: s.metadata?.pinecone_score || s.score,
                                rerank_score: s.metadata?.rerank_score,
                                title: s.metadata?.title || s.title,
                                author: s.metadata?.author || s.author,
                                excerpt: s.full_text?.substring(0, 200),
                                excerpt_relevance: s.segment_analysis?.statistics?.max_similarity || 0,
                                pos: getSmartPosition(s.metadata?.year || s.year, newStrata),
                                color: (s.type || '').toUpperCase() === "PRIMARY" ? rams.blue : 
                                       (s.type || '').toUpperCase() === "QUOTES" ? rams.orange : rams.red
                            });
                        });
                        setActiveStrata(newStrata);
                        setSyntheticResponse(data.response || "");
                        setSearchLog(data.search_log || null);
                        setResponseComposition(data.response_composition || null);
                        setGenealogy(data.genealogy || null);
                        setDetectedVisuals(data.visuals || []);
                        setVisualNodes([]);
                        setDiscursiveState(data.state || "GENEALOGI");
                        setIntensity(data.intensity || 0.8);
                        setSelectedSources([]);
                        setConversationHistory(prev => [
                            ...prev,
                            { role: "user", content: prompt },
                            { role: "assistant", content: data.response || "" }
                        ]);
                        addLog(`Forskermodus komplet.`);
                        return; // Exit early for research mode
                    }

                    const newStrata = [];
                    if (data.strata && Array.isArray(data.strata)) {
                        data.strata.forEach((s, i) => {
                            newStrata.push({
                                ...s,
                                pos: getSmartPosition(s.year, newStrata),
                                color: s.type === "PRIMARY" ? rams.blue : 
                                       s.type === "QUOTES" ? rams.orange : rams.red
                            });
                        });
                        setActiveStrata(newStrata);
                    }

                    setDetectedVisuals(data.visuals || []);
                    setVisualNodes([]);
                    setSyntheticResponse(data.text || "");
                    setDiscursiveState(data.state || "GENEALOGI");
                    setIntensity(data.intensity || 0.8);
                    setGenealogy(data.genealogy || null);
                    setSelectedSources([]);
                    
                    setConversationHistory(prev => [
                        ...prev,
                        { role: "user", content: prompt },
                        { role: "assistant", content: data.text || "" }
                    ]);
                    
                    addLog(`Genealogi etableret. (${conversationHistory.length/2 + 1} udvekslinger)`);
                } catch (error) {
                    addLog(`Fejl: ${error.message}`);
                } finally {
                    setIsSynthesizing(false);
                }
            };

            const handleTryAgain = () => {
                if (!lastQuery) return;
                executeGenealogicalRAG(lastQuery);
            };

            const spawnVisual = (visual) => {
                if (visualNodes.find(v => v.keyword === visual.keyword)) return;
                const pos = getSmartPosition(1960, visualNodes);
                const newNode = { ...visual, id: `vis-${Date.now()}`, pos: pos };
                setVisualNodes(prev => [...prev, newNode]);
                addLog(`Projicerer: ${visual.keyword}`);
            };

            const renderResponseWithVisuals = (text) => {
                if (!detectedVisuals || !detectedVisuals.length) return text;
                const patterns = detectedVisuals.map(v => v.keyword).join("|");
                const regex = new RegExp(`(${patterns})`, "gi");
                const parts = text.split(regex);

                return parts.map((part, i) => {
                    const match = detectedVisuals.find(v => v.keyword.toLowerCase() === part.toLowerCase());
                    if (match) {
                        const isActive = visualNodes.find(n => n.keyword === match.keyword);
                        return (
                            <span 
                                key={i}
                                onClick={() => spawnVisual(match)}
                                className={`cursor-pointer transition-all border-b-2 font-medium mx-0.5 px-1 rounded-sm ${
                                    isActive 
                                        ? 'border-blue-500 text-blue-700 bg-blue-50' 
                                        : 'border-dashed border-gray-400 text-gray-700 hover:border-blue-400 hover:bg-blue-50/50'
                                }`}
                                title="Klik for at projicere billede">
                                <LucideIcon name="image" size={14} className="inline mr-1 mb-0.5 opacity-50" />
                                {part}
                            </span>
                        );
                    }
                    return part;
                });
            };

            const toggleSource = (source) => {
                if (draggedNode) return;
                setSelectedSources(prev => {
                    const exists = prev.find(s => s.id === source.id);
                    if (exists) return prev.filter(s => s.id !== source.id);
                    return [...prev, source];
                });
            };

            const closeSidebar = (e) => {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                setSelectedSources([]);
                setHoveredSource(null);
            };

            const getHighlightedText = (fullText, response, sourceRef) => {
                if (!response || !fullText) return null;
                
                let attributedSegments = [];
                if (genealogy && genealogy.source_attributions) {
                    const attr = genealogy.source_attributions.find(a => a.source_ref === sourceRef);
                    if (attr && attr.segments) {
                        attributedSegments = attr.segments.map(s => ({
                            text: s.text,
                            similarity: s.similarity
                        }));
                    }
                }

                if (attributedSegments.length === 0) {
                    return (
                        <div className="text-[13px] text-stone-400 leading-relaxed blur-[3px] select-none pointer-events-none user-select-none">
                            {fullText}
                        </div>
                    );
                }

                const sentences = fullText.split(/([.!?]+\s+)/).filter(Boolean);
                let fullSentences = [];
                for (let i = 0; i < sentences.length; i += 2) {
                    fullSentences.push((sentences[i] + (sentences[i+1] || "")).trim());
                }

                return (
                    <div className="text-[13px] leading-relaxed">
                        {fullSentences.map((sentence, i) => {
                            const matchingSegment = attributedSegments.find(seg => 
                                sentence.includes(seg.text) || 
                                seg.text.includes(sentence) ||
                                (sentence.length > 20 && seg.text.length > 20 && 
                                 levenshteinSimilarity(sentence, seg.text) > 0.6)
                            );

                            if (matchingSegment) {
                                const isDirect = matchingSegment.similarity > 0.65;
                                return (
                                    <span key={i} className={`${
                                        isDirect 
                                            ? 'bg-sky-100 text-stone-900 font-medium border-b-2 border-sky-400' 
                                            : 'bg-stone-50 text-stone-800 border-b border-stone-300'
                                    } px-1 mr-1`}>
                                        {sentence}
                                    </span>
                                );
                            } else {
                                return (
                                    <span key={i} className="text-stone-400 blur-[3px] select-none pointer-events-none user-select-none mr-1">
                                        {sentence}
                                    </span>
                                );
                            }
                        })}
                    </div>
                );
            };

            const levenshteinSimilarity = (s1, s2) => {
                const longer = s1.length > s2.length ? s1 : s2;
                const shorter = s1.length > s2.length ? s2 : s1;
                if (longer.length === 0) return 1.0;
                
                const editDistance = (s1, s2) => {
                    s1 = s1.toLowerCase();
                    s2 = s2.toLowerCase();
                    const costs = [];
                    for (let i = 0; i <= s1.length; i++) {
                        let lastValue = i;
                        for (let j = 0; j <= s2.length; j++) {
                            if (i === 0) costs[j] = j;
                            else if (j > 0) {
                                let newValue = costs[j - 1];
                                if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                                    newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                                costs[j - 1] = lastValue;
                                lastValue = newValue;
                            }
                        }
                        if (i > 0) costs[s2.length] = lastValue;
                    }
                    return costs[s2.length];
                };
                
                return (longer.length - editDistance(longer, shorter)) / longer.length;
            };

            const handleSubmit = () => executeGenealogicalRAG(documentText);
            const handleKeyPress = (e) => { 
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleSubmit();
            };

            const resetAll = () => {
                stopVoice();
                setDocumentText("");
                setLastQuery("");
                setSyntheticResponse("");
                setActiveStrata([]);
                setVisualNodes([]);
                setDetectedVisuals([]);
                setGenealogy(null);
                setSelectedSources([]);
                setSelectedConcept(null);
                setHoveredSource(null);
                setConversationHistory([]);
                setSearchLog(null);
                setResponseComposition(null);
                setSourceAnalytics(null);
                setShowAnalyticsPanel(false);
            };

            useEffect(() => {
                const simulationLoop = setInterval(() => {
                    setActiveStrata(currentNodes => {
                        if (currentNodes.length < 2) return currentNodes;

                        let hasMovement = false;
                        
                        const nextNodes = currentNodes.map(n => ({
                            ...n, 
                            pos: { ...n.pos },
                            velocity: { x: 0, y: 0 }
                        }));

                        const REPULSION_DIST = 32;
                        const REPULSION_STRENGTH = 0.4;
                        const FORBIDDEN_REPULSION = 0.8;
                        const EDGE_REPULSION = 0.5;
                        
                        const chatBoxZone = { 
                            xMin: 18, xMax: 82,
                            yMin: 65, yMax: 100
                        };
                        
                        for (let i = 0; i < nextNodes.length; i++) {
                            const nodeA = nextNodes[i];
                            
                            if (nodeA.id === draggedNode) continue;

                            if (nodeA.pos.y > chatBoxZone.yMin - 5 && 
                                nodeA.pos.x > chatBoxZone.xMin && 
                                nodeA.pos.x < chatBoxZone.xMax) {
                                const sideForce = (nodeA.pos.x > 50 ? 1 : -1) * 0.2;
                                
                                nodeA.pos.y -= FORBIDDEN_REPULSION;
                                nodeA.pos.x += sideForce;
                                hasMovement = true;
                            }

                            const MARGIN = 5;
                            if (nodeA.pos.x < MARGIN) {
                                nodeA.pos.x += EDGE_REPULSION * (MARGIN - nodeA.pos.x);
                                hasMovement = true;
                            }
                            if (nodeA.pos.x > 100 - MARGIN) {
                                nodeA.pos.x -= EDGE_REPULSION * (nodeA.pos.x - (100 - MARGIN));
                                hasMovement = true;
                            }
                            if (nodeA.pos.y < MARGIN) {
                                nodeA.pos.y += EDGE_REPULSION * (MARGIN - nodeA.pos.y);
                                hasMovement = true;
                            }
                            if (nodeA.pos.y > 72 - MARGIN) {
                                nodeA.pos.y -= EDGE_REPULSION * (nodeA.pos.y - (72 - MARGIN));
                                hasMovement = true;
                            }

                            for (let j = 0; j < nextNodes.length; j++) {
                                if (i === j) continue;
                                const nodeB = nextNodes[j];

                                const dx = (nodeA.pos.x - nodeB.pos.x) * 1.6; 
                                const dy = nodeA.pos.y - nodeB.pos.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);

                                if (distance > 0 && distance < REPULSION_DIST) {
                                    const force = (REPULSION_DIST - distance) / REPULSION_DIST;
                                    const pushX = (dx / distance) * force * REPULSION_STRENGTH;
                                    const pushY = (dy / distance) * force * REPULSION_STRENGTH;

                                    nodeA.pos.x += pushX;
                                    nodeA.pos.y += pushY;
                                    
                                    hasMovement = true;
                                }
                            }

                            if (nodeA.pos.x < 2) nodeA.pos.x = 2;
                            if (nodeA.pos.x > 98) nodeA.pos.x = 98;
                            if (nodeA.pos.y < 2) nodeA.pos.y = 2;
                            if (nodeA.pos.y > 72) nodeA.pos.y = 72;
                        }

                        return hasMovement ? nextNodes : currentNodes;
                    });
                }, 25);

                return () => clearInterval(simulationLoop);
            }, [draggedNode, activeStrata.length]);

            const renderTimeline = () => {
                const timeline = genealogy?.discursive_shifts?.timeline;
                if (!timeline || timeline.length === 0) return null;
                
                const sortedSources = [...activeStrata].sort((a, b) => (parseInt(a.year) || 0) - (parseInt(b.year) || 0));
                
                return sortedSources.map((source, i) => {
                    if (i === 0) return null;
                    const prev = sortedSources[i - 1];
                    
                    return (
                        <g key={`timeline-${i}`}>
                            <line 
                                x1={`${prev.pos.x}%`} y1={`${prev.pos.y}%`}
                                x2={`${source.pos.x}%`} y2={`${source.pos.y}%`}
                                stroke="#a8a29e" strokeWidth="1"
                                strokeDasharray="4,4" 
                                opacity="0.4"
                            />
                        </g>
                    );
                });
            };

            const renderConceptConnections = () => {
                if (!selectedConcept || !genealogy?.concept_genealogies?.[selectedConcept]) return null;
                const conceptData = genealogy.concept_genealogies[selectedConcept];
                const sourceIds = conceptData.occurrences.map(o => o.source_id);
                const connectedNodes = activeStrata.filter(s => sourceIds.includes(s.id));
                
                return connectedNodes.map((node, i) => {
                    if (i === 0) return null;
                    const prev = connectedNodes[i - 1];
                    
                    const midX = (prev.pos.x + node.pos.x) / 2;
                    const midY = (prev.pos.y + node.pos.y) / 2;
                    
                    return (

                            <line 
                                x1={`${prev.pos.x}%`} y1={`${prev.pos.y}%`}

                                stroke="#0ea5e9" strokeWidth="1.5"
                                strokeDasharray="6,4" opacity="0.4"
                            />
                            <line 
                                x1={`${prev.pos.x}%`} y1={`${prev.pos.y}%`}
                                x2={`${node.pos.x}%`} y2={`${node.pos.y}%`}
                                stroke="#0ea5e9" strokeWidth="3"
                                strokeDasharray="20,200" 
                                opacity="0.6"
                                style={{ 
                                    filter: 'blur(2px)',
                                    animation: `dash-flow-${i} 3s linear infinite`
                                }}
                            />
                            <style>{`
                                @keyframes dash-flow-${i} {
                                    0% { stroke-dashoffset: 220; opacity: 0; }
                                    10% { opacity: 0.8; }
                                    90% { opacity: 0.8; }
                                    100% { stroke-dashoffset: 0; opacity: 0; }
                                }
                            `}</style>
                            <line 
                                x1={`${prev.pos.x}%`} y1={`${prev.pos.y}%`}
                                x2={`${node.pos.x}%`} y2={`${node.pos.y}%`}
                                stroke="#0ea5e9" strokeWidth="6"
                                opacity="0.04"
                                style={{ filter: 'blur(4px)' }}
                            />
                            <circle 
                                cx={`${midX}%`} cy={`${midY}%`} r="2.5"
                                fill="#0ea5e9" opacity="0.6"
                            />
                        </g>
                    );
                });
            };

            const renderThematicConnections = () => {
                if (!selectedConcept) return null;
                const thematic = genealogy?.discursive_shifts?.thematic_shifts?.find(t => t.term === selectedConcept);
                if (!thematic) return null;

                    .map(o => activeStrata.find(s => s.ref === o.source))
                    .filter(Boolean);
                
                return connectedSources.map((node, i) => {
                    if (i === 0) return null;
                    const prev = connectedSources[i - 1];
                    
                    return (
                        <g key={`thematic-${i}`}>
                            <line 
                                x1={`${prev.pos.x}%`} y1={`${prev.pos.y}%`}
                                x2={`${node.pos.x}%`} y2={`${node.pos.y}%`}
                                stroke="#10b981" strokeWidth="2"
                                strokeDasharray="8,4" opacity="0.5"
                            />
                        </g>
                    );
                });
            };

            return (
                <div className="h-screen w-screen flex flex-col relative bg-[#f2f2f2] font-mono overflow-hidden">
                    <style>{`
                        body { font-family: 'IBM Plex Mono', monospace; overflow: hidden; background: radial-gradient(circle at center, #fdfdfd 0%, #ebebeb 100%); }
                        .serif { font-family: 'Libre Baskerville', serif; }
                        .mono { font-family: 'IBM Plex Mono', monospace; }
                        
                        .select-none { 
                            user-select: none !important; 
                            -webkit-user-select: none !important;
                            -moz-user-select: none !important;
                            -ms-user-select: none !important;
                        }

                        }
                        .user-select-none::selection {

                        }
                        
                        @keyframes glow-pulse { 0% { opacity: 0.08; transform: scale(1); } 50% { opacity: 0.15; transform: scale(1.05); } 100% { opacity: 0.08; transform: scale(1); } }
                        .animate-glow { animation: glow-pulse 15s ease-in-out infinite; }
                        
                        @keyframes breathe { 0% { opacity: 0; transform: scale(0.9); } 50% { opacity: 0.3; transform: scale(1.05); } 100% { opacity: 0; transform: scale(1.2); } }
                        .animate-breathe { animation: breathe 5s ease-in-out infinite; }
                        
                        .glass-membrane { background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05)); backdrop-filter: blur(50px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.1); }
                        
                        .source-node { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); cursor: move; }
                        .source-node:hover { scale: 1.01; z-index: 100; background: rgba(255, 255, 255, 0.95) !important; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15); width: 340px !important; }

                        .source-node.dragging { opacity: 0.7; cursor: grabbing; z-index: 200; }
                        .research-border { border: 2px solid #0284c7 !important; box-shadow: 0 0 20px rgba(2, 132, 199, 0.15); }
                        
                        .visual-node { border-radius: 4px; overflow: hidden; border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); opacity: 0; animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 1.2s; }
                        @keyframes pop-in { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

                            width: 100%;
                            height: 2px;
                            background: currentColor;
                            opacity: 0.3;
                            transform: scaleX(1.05) rotate(-0.5deg);
                        }
                    `}</style>

                    {/* INFO-IKON + FORSKERMODUS ØVERST-HØJRE */}
                    <div className="fixed top-4 right-4 z-[100] flex items-center gap-2">
                        {researchAllowed && (
                            <>
                                <button
                                    onClick={() => setResearchMode(!researchMode)}
                                    className={`px-3 py-1 rounded-full text-[9px] mono font-bold tracking-wide transition-all ${
                                        researchMode
                                            ? 'bg-sky-600 text-white shadow-lg shadow-sky-600/30'
                                            : 'bg-white/80 backdrop-blur-sm text-stone-500 hover:bg-sky-50 hover:text-sky-700 border border-stone-200/60'
                                    }`}>
                                    🔬 {researchMode ? 'PÅ' : 'AV'}
                                </button>
                                {researchMode && (
                                    <>
                                        <button onClick={fetchSourceAnalytics} className="px-2 py-1 rounded-full text-[8px] mono font-medium bg-white/80 backdrop-blur-sm hover:bg-stone-100 border border-stone-200/60">📊</button>
                                        <button onClick={exportCurrentAnalysis} disabled={!syntheticResponse} className="px-2 py-1 rounded-full text-[8px] mono font-medium bg-white/80 backdrop-blur-sm hover:bg-stone-100 border border-stone-200/60 disabled:opacity-30">💾</button>
                                        <button onClick={exportSession} className="px-2 py-1 rounded-full text-[8px] mono font-medium bg-white/80 backdrop-blur-sm hover:bg-stone-100 border border-stone-200/60">📦</button>

                        <button
                            onClick={() => setShowGenealogy(!showGenealogy)}
                            className={`px-2 py-1 rounded-full text-[8px] mono font-medium tracking-wide transition-all border ${
                                showGenealogy ? 'bg-stone-700 text-white border-stone-700' : 'bg-white/80 backdrop-blur-sm text-stone-500 border-stone-200/60 hover:bg-stone-100'

                    {/* INFO-POPOVER */}
                    {showInfoPopover && (
                        <>
                            <div className="fixed inset-0 z-[99]" onClick={() => setShowInfoPopover(false)} />
                            <div className="fixed z-[100]" style={{ top: '42px', right: '16px', width: '320px' }}>

                                    <div style={{ height: '0.5px' }} className="bg-stone-200 my-3" />

                                            onClick={() => { setShowAboutModal(true); setShowInfoPopover(false); }}

                    {/* TITEL NEDERST-VENSTRE */}
                    <a href="https://bygningskunstogkultur.dk/nr-11-2026/fisker-arkivet-og-maskinen"
                        target="_blank" rel="noopener noreferrer"
                        className="fixed z-[90] flex items-center gap-1.5 group" style={{ bottom: '16px', left: '16px', height: '18px' }}>
                        <span className="serif italic text-[12px] text-stone-700 leading-none group-hover:text-stone-900 transition-colors">Fisker, arkivet og maskinen</span>
                        <LucideIcon name="external-link" size={9} className="text-stone-400 group-hover:text-stone-600 transition-colors" />
                    </a>

                    {/* STATE-INDIKATOR NEDERST-HØJRE */}
                    <div className="fixed z-[90] flex items-center" style={{ bottom: '16px', right: '16px', height: '18px' }}>
                        <span className={`mono text-[9px] tracking-[0.15em] leading-none ${isSynthesizing ? 'text-sky-500 animate-pulse' : 'text-stone-400'}`}>

                    <main className={`flex-grow relative z-10 transition-all duration-500 ${selectedSources.length > 0 || showGenealogy ? 'mr-[520px]' : 'mr-0'}`} style={{ marginTop: 0 }}>
                        
                        {(isSynthesizing || isVoicePlaying) && (
                            <div className="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
                                <div
                                    className={`w-[50vh] h-[50vh] rounded-full blur-[100px] bg-gradient-to-tr from-blue-400 to-cyan-200 ${isSynthesizing ? 'animate-breathe' : ''}`}
                                    style={isVoicePlaying ? {

                        <div className="absolute inset-0 z-0 pointer-events-none">

                                    style={{ 
                                        left: `${s.pos.x}%`, top: `${s.pos.y}%`, 
                                        width: '40%', height: '40%',

                        </div>

                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-5" 
                            style={{ filter: showGenealogy ? 'none' : 'blur(2px) opacity(0.3)' }}>
                            {renderTimeline()}
                            {renderThematicConnections()}
                            {renderConceptConnections()}
                        </svg>

                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                            {visualNodes.map((v, i) => ( 
                                <path key={`vis-link-${i}`} 
                                    d={`M ${viewport.w / 2} ${viewport.h - 140} Q ${v.pos.x * viewport.w / 100} ${viewport.h - 50} ${v.pos.x * viewport.w / 100} ${v.pos.y * viewport.h / 100}`}
                                    stroke="#3b82f6" strokeWidth="1.5" fill="none" 
                                    className="visual-line opacity-50" 
                                /> 
                            ))}
                            
                            {selectedSources.length > 1 && selectedSources.map((s, i) => {

                                            <div className="space-y-3">
                                                <h3 className="text-[12px] font-bold text-stone-800 mb-4 flex items-center gap-2">
                                                    <div className="w-1 h-4 bg-blue-500"></div>
                                                    Kildefordeling
                                                </h3>
                                                
                                                <div className="bg-white/60 backdrop-blur-md p-4 rounded-sm border border-white/40 shadow-sm space-y-3">
                                                    <div className="space-y-2">
                                                        <div>
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-[10px] mono text-stone-600">Primærkilder</span>
                                                                <span className="text-[11px] font-bold text-blue-700 mono">
                                                                    {genealogy.power_knowledge.hierarchy.PRIMARY}
                                                                </span>
                                                            </div>
                                                            <div className="h-2 bg-stone-200 rounded-full overflow-hidden">
                                                                <div 
                                                                    className="h-full bg-blue-500"
                                                                    style={{ 
                                                                        width: `${(genealogy.power_knowledge.hierarchy.PRIMARY / 
                                                                            (genealogy.power_knowledge.hierarchy.PRIMARY + 
                                                                             genealogy.power_knowledge.hierarchy.QUOTES + 
                                                                             genealogy.power_knowledge.hierarchy.SECONDARY)) * 100}%` 
                                                                    }}
                                                                ></div>
                                                            </div>
                                                        </div>
                                                        
                                                        <div>
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-[10px] mono text-stone-600">Citater</span>
                                                                <span className="text-[11px] font-bold text-stone-600 mono">
                                                                    {genealogy.power_knowledge.hierarchy.QUOTES}
                                                                </span>
                                                            </div>
                                                            <div className="h-2 bg-stone-200 rounded-full overflow-hidden">
                                                                <div 
                                                                    className="h-full bg-sky-500"
                                                                    style={{ 
                                                                        width: `${(genealogy.power_knowledge.hierarchy.QUOTES / 
                                                                            (genealogy.power_knowledge.hierarchy.PRIMARY + 
                                                                             genealogy.power_knowledge.hierarchy.QUOTES + 
                                                                             genealogy.power_knowledge.hierarchy.SECONDARY)) * 100}%` 
                                                                    }}
                                                                ></div>
                                                            </div>
                                                        </div>
                                                        
                                                        <div>
                                                            <div className="flex justify-between items-center mb-1">
                                                                <span className="text-[10px] mono text-stone-600">Sekundærkilder</span>
                                                                <span className="text-[11px] font-bold text-stone-700 mono">
                                                                    {genealogy.power_knowledge.hierarchy.SECONDARY}
                                                                </span>
                                                            </div>
                                                            <div className="h-2 bg-stone-200 rounded-full overflow-hidden">
                                                                <div 
                                                                    className="h-full bg-stone-500"
                                                                    style={{ 
                                                                        width: `${(genealogy.power_knowledge.hierarchy.SECONDARY / 
                                                                            (genealogy.power_knowledge.hierarchy.PRIMARY + 
                                                                             genealogy.power_knowledge.hierarchy.QUOTES + 
                                                                             genealogy.power_knowledge.hierarchy.SECONDARY)) * 100}%` 
                                                                    }}
                                                                ></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="pt-3 mt-3 border-t border-stone-200">
                                                        <div className="text-[10px] mono text-stone-500 mb-1">Kildegrundlag</div>
                                                        <div className="text-[12px] font-medium text-stone-800">{genealogy.power_knowledge.dominant_discourse}</div>
                                                        {genealogy.power_knowledge.dominant_explanation && (
                                                            <div className="text-[11px] text-stone-600 mt-1 italic">
                                                                {genealogy.power_knowledge.dominant_explanation}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                        
                                    </>
                                )}
                            </div>
                        </aside>
                    )}

                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-lg z-50 px-4">
                        <div className="glass-membrane rounded-[2rem] p-8 transition-all duration-700 hover:shadow-2xl">
                            <div className="relative">
                                <textarea 
                                    value={documentText} 
                                    onChange={e => setDocumentText(e.target.value)} 
                                    onKeyDown={handleKeyPress} 
                                    placeholder="Indtast genealogisk spørgsmål..." 
                                    className={`w-full text-[16px] serif leading-relaxed text-black border-none outline-none p-0 placeholder-black/20 resize-none bg-transparent h-[60px] transition-all ${isSynthesizing ? 'opacity-20' : 'opacity-100'}`}
                                    spellCheck="false" 
                                />
                                <div className="flex justify-end mt-2 gap-2">
                                    {lastQuery && syntheticResponse && (
                                        <button 
                                            onClick={handleTryAgain} 
                                            disabled={isSynthesizing}
                                            className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-stone-500/10 hover:bg-stone-500/15 disabled:opacity-30 transition-all text-[9px] mono font-medium tracking-wide border border-stone-300/40">
                                            <LucideIcon name="refresh-ccw" size={12} /> Prøv igen
                                        </button>
                                    )}
                                    <button 
                                        onClick={handleSubmit} 
                                        disabled={isSynthesizing || !documentText.trim()} 
                                        className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/5 hover:bg-black/10 disabled:opacity-30 transition-all text-[9px] mono font-medium tracking-wide border border-white/20">
                                        <LucideIcon name="send" size={12} /> {isSynthesizing ? 'Analyserer...' : 'Genealogisér (⌘↵)'}
                                    </button>
                                </div>
                            </div>
                            
                            {syntheticResponse && (
                                <div className="border-t border-white/20 mt-6 pt-6 animate-in fade-in slide-in-from-bottom-2 duration-1000">
                                    <div className="text-[21px] serif italic text-gray-900 leading-snug tracking-tight text-center px-2">
                                        {renderResponseWithVisuals(syntheticResponse)}
                                    </div>
                                    <div className="mt-6 flex justify-between items-center text-[9px] mono text-stone-500">
                                        <div className="flex items-center gap-3">
                                            <span>v.10.16</span>
                                            {conversationHistory.length > 0 && (
                                                <span className="px-2 py-0.5 bg-sky-100 text-sky-700 rounded-full">
                                                    {Math.floor(conversationHistory.length / 2)} udvekslinger
                                                </span>
                                            )}
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button
                                                onClick={() => isVoicePlaying ? stopVoice() : playVoice(syntheticResponse)}
                                                disabled={isVoiceLoading}
                                                className={`flex items-center gap-1.5 px-2 py-1 rounded-full transition-all text-[9px] mono font-medium tracking-wide border ${
                                                    isVoicePlaying
                                                        ? 'bg-sky-500/10 border-sky-400/40 text-sky-700 hover:bg-sky-500/20'
                                                        : isVoiceLoading
                                                        ? 'bg-black/5 border-white/20 text-stone-400'
                                                        : 'bg-black/5 border-white/20 hover:bg-black/10 hover:text-black'
                                                }`}>
                                                <LucideIcon name={isVoicePlaying ? 'square' : isVoiceLoading ? 'loader' : 'volume-2'} size={12} />
                                                {isVoicePlaying ? 'Stop' : isVoiceLoading ? 'Indlæser...' : 'Hør stemmen'}
                                            </button>
                                            <button onClick={resetAll} className="hover:text-black transition-all flex items-center gap-1.5 bg-black/5 px-2 py-1 rounded-full border border-white/20">
                                                <LucideIcon name="refresh-cw" size={12} /> NY SAMTALE
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {showAboutModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center" onClick={() => setShowAboutModal(false)}>
                            <div className="absolute inset-0 bg-black/30 backdrop-blur-sm" />
                            <div
                                className="relative bg-white rounded-2xl max-w-[560px] w-full mx-6 max-h-[80vh] overflow-y-auto shadow-2xl"
                                onClick={(e) => e.stopPropagation()}>
                                <div className="p-8">
                                    <div className="flex items-center justify-between mb-6">
                                        <h2 className="serif italic text-[14px] text-stone-700">Fisker, arkivet og maskinen</h2>
                                        <button
                                            onClick={() => setShowAboutModal(false)}
                                            className="text-stone-400 hover:text-stone-700 transition-colors text-[18px] leading-none p-1">
                                            ×
                                        </button>
                                    </div>

                                    <div className="space-y-5 serif text-[13px] leading-relaxed text-stone-700">
                                        <p>
                                            Hvad sker der, når en sprogmodel trænes på Kay Fiskers egne tekster og stilles til regnskab for modernismens ambitioner og blinde punkter? Gennem et eksperiment med syntetisk vidensproduktion undersøger dette essay, hvordan en digital rekonstruktion af Fiskers stemme ikke blot aktiverer arkivets viden, men også afslører dets tavsheder, skævheder og magtstrukturer.
                                        </p>

                                        <div style={{ height: '0.5px' }} className="bg-stone-200" />

                                        <div className="space-y-3">
                                            <div>
                                                <span className="mono text-[9px] font-bold uppercase tracking-widest text-stone-400 block mb-1">Teknisk grundlag</span>
                                                <p>
                                                    Mistral 7B finjusteret med LoRA på Kay Fiskers egne tekster, suppleret med en RAG-arkitektur der giver realtidsadgang til arkivkilder via Pinecone vector database.
                                                </p>
                                                <a href="https://bygningskunstogkultur.dk/nr-11-2026/fisker-arkivet-og-maskinen"
                                                    target="_blank" rel="noopener noreferrer"
                                                    className="mono text-[10px] text-stone-700 hover:text-stone-900 mt-2 inline-block transition-colors">
                                                    Læs den uddybende artikel →
                                                </a>
                                            </div>

                                            <div>
                                                <span className="mono text-[9px] font-bold uppercase tracking-widest text-stone-400 block mb-1">Projekt af</span>
                                                <p>Andreas Vold, arkitekt, Det Kongelige Akademi.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer fjernet - titel og state er nu fixed elementer */}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
